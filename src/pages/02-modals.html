<style>
.mask { position: absolute; inset: 0; z-index: 5; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
.on .mask { opacity: 1; visibility: visible; transition: opacity .25s; }
.pop { position: absolute; z-index: 6; background: var(--surface); box-shadow: 0 14px 30px var(--shadow); visibility: hidden; }
.on .pop { visibility: visible; }
.m-title { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.m-text { margin: 0; font-size: 13px; color: var(--muted); }
.m-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.btn.danger { background: var(--err); color: var(--surface); }

.m-dialog { left: 50%; top: 50%; width: min(84%, 260px); padding: 15px 16px; border-radius: 14px; opacity: 0; transform: translate(-50%, -50%) scale(.86); transition: transform .3s cubic-bezier(.2, 1.35, .4, 1), opacity .2s, visibility 0s .3s; }
.on .m-dialog { opacity: 1; transform: translate(-50%, -50%); transition: transform .3s cubic-bezier(.2, 1.35, .4, 1), opacity .2s; }
.m-dialog.shake { animation: m-shake .4s; }
@keyframes m-shake { 20% { translate: -7px; } 40% { translate: 6px; } 60% { translate: -4px; } 80% { translate: 3px; } }
.m-warn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); color: var(--err); font-weight: 800; margin-bottom: 7px; }

.m-drawer { top: 0; right: 0; bottom: 0; width: 66%; padding: 14px; border-radius: 14px 0 0 14px; transform: translateX(105%); transition: transform .3s cubic-bezier(.2, .9, .3, 1), visibility 0s .3s; display: grid; align-content: start; gap: 9px; }
.on .m-drawer { transform: none; transition: transform .3s cubic-bezier(.2, .9, .3, 1); }
.m-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.m-chips span { font-size: 12px; padding: 1px 9px; border-radius: 12px; background: var(--soft); }

.m-sheet { left: 0; right: 0; bottom: 0; padding: 8px 16px 16px; border-radius: 16px 16px 0 0; transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .9, .3, 1), visibility 0s .3s; }
.on .m-sheet { transform: none; transition: transform .3s cubic-bezier(.2, .9, .3, 1); }
[data-name="底部弹层"] .hint { bottom: auto; top: 7px; }
.m-grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.m-share { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: 12px; }
.m-share button { display: grid; justify-items: center; gap: 3px; border: 0; background: none; cursor: pointer; padding: 0; }
.m-share i { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, var(--art3), var(--art1)); }
.m-share button:nth-child(2) i { background: linear-gradient(145deg, var(--art1), var(--art2)); }
.m-share button:nth-child(3) i { background: var(--soft); }
.m-share button:nth-child(4) i { background: var(--accent-deep); }

.m-toasts { position: absolute; top: 12px; left: 0; right: 0; z-index: 8; display: grid; justify-items: center; gap: 6px; pointer-events: none; }
.m-toast { display: flex; gap: 7px; align-items: center; padding: 6px 14px; border-radius: 18px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: 0 6px 14px var(--shadow); animation: m-t-in .3s cubic-bezier(.2, 1.3, .4, 1), m-t-out .25s 2s forwards; }
@keyframes m-t-in { from { opacity: 0; transform: translateY(-16px) scale(.9); } }
@keyframes m-t-out { to { opacity: 0; transform: translateY(-10px); } }

.m-notice { position: absolute; top: 12px; right: 12px; z-index: 8; width: min(80%, 240px); padding: 10px 12px 12px; border-radius: 12px; background: var(--surface); box-shadow: 0 10px 24px var(--shadow); overflow: hidden; animation: m-n-in .35s cubic-bezier(.2, 1, .3, 1); }
.m-notice.out { transition: transform .25s, opacity .25s; transform: translateX(110%); opacity: 0; }
@keyframes m-n-in { from { transform: translateX(110%); } }
.m-notice button { position: absolute; top: 5px; right: 6px; border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--muted); line-height: 1; padding: 3px; }
.m-notice .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); transform-origin: left; animation: m-bar 6s linear forwards; }
@keyframes m-bar { to { transform: scaleX(0); } }

.m-pv { position: relative; }
.m-popover { left: 50%; bottom: calc(100% + 11px); width: 190px; padding: 11px 13px; border-radius: 11px; opacity: 0; transform: translateX(-50%) scale(.8); transform-origin: 50% 100%; transition: transform .2s cubic-bezier(.2, 1.4, .4, 1), opacity .15s, visibility 0s .2s; }
.m-popover::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 11px; height: 11px; margin-left: -5.5px; background: var(--surface); transform: rotate(45deg); }
.on .m-popover { opacity: 1; transform: translateX(-50%); transition: transform .2s cubic-bezier(.2, 1.4, .4, 1), opacity .15s; }
.m-who { display: flex; gap: 9px; align-items: center; }
.m-who i { flex: none; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(145deg, var(--art3), var(--art2)); }

.m-tips { display: flex; gap: 14px; }
.m-tt { position: relative; }
.m-tt button { width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; }
.m-tip { position: absolute; left: 50%; bottom: calc(100% + 9px); padding: 3px 9px; font-size: 12px; white-space: nowrap; border-radius: 6px; background: var(--ink); color: var(--bg); opacity: 0; transform: translate(-50%, 5px); pointer-events: none; transition: opacity .15s, transform .15s; }
.m-tip::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 8px; height: 8px; margin-left: -4px; background: var(--ink); transform: rotate(45deg); }
.m-tt:hover .m-tip, .m-tt:focus-within .m-tip, .m-tt.show .m-tip { opacity: 1; transform: translate(-50%, 0); }

.m-dd { position: relative; align-self: start; margin-top: 26px; }
.m-dd .chev { display: inline-block; margin-left: 5px; transition: transform .2s; }
.on .m-dd .chev { transform: rotate(180deg); }
.m-menu { left: 0; top: calc(100% + 6px); width: 150px; padding: 5px; margin: 0; list-style: none; border-radius: 11px; opacity: 0; transform: translateY(-6px); transition: opacity .15s, transform .15s, visibility 0s .15s; }
.on .m-menu { opacity: 1; transform: none; transition: opacity .15s, transform .15s; }
.m-menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 9px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.m-menu button:hover, .m-menu button:focus-visible { background: var(--soft); }
.m-menu li { opacity: 0; transform: translateY(-5px); }
.on .m-menu li { opacity: 1; transform: none; transition: opacity .2s, transform .2s; transition-delay: calc(var(--i) * 45ms); }
.m-menu .del { color: var(--err); }

.m-thumbs { display: flex; gap: 9px; }
.m-thumbs button { width: 84px; height: 84px; border: 0; padding: 0; border-radius: 10px; cursor: zoom-in; }
.m-art1 { background: linear-gradient(160deg, var(--art3), var(--art1) 60%, var(--art2)); }
.m-art2 { background: radial-gradient(circle at 30% 30%, var(--art3) 18%, transparent 19%), linear-gradient(200deg, var(--art1), var(--art2)); }
.m-art3 { background: linear-gradient(158deg, transparent 62%, var(--art2) 62.5%), linear-gradient(204deg, transparent 48%, var(--art1) 48.5%), linear-gradient(var(--art3), var(--art3)); }
.m-lb { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; visibility: hidden; background: transparent; transition: background .3s, visibility 0s .3s; cursor: zoom-out; }
.on .m-lb { visibility: visible; background: var(--scrim); transition: background .3s; }
.m-lb-img { width: 72%; height: 78%; border-radius: 12px; display: grid; align-items: end; color: var(--on-art); padding: 7px 11px; font-size: 13px; transform-origin: 0 0; box-shadow: 0 14px 34px var(--shadow); }
.m-lb-img span { opacity: 0; transition: opacity .2s .2s; }
.on .m-lb-img span { opacity: 1; }
.m-x { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: none; cursor: pointer; font-size: 16px; line-height: 1; color: var(--muted); }
.m-x:hover { background: var(--soft); color: var(--ink); }
.m-del-row { display: flex; align-items: center; gap: 20px; padding: 8px 13px; background: var(--surface); border-radius: 10px; box-shadow: 0 2px 8px var(--shadow); font-size: 14px; margin-top: 66px; }

.m-pc { width: 178px; }
.m-pc .m-row { margin-top: 8px; }
</style>

<script>
demo.confirm = (stage) => {
  const dlg = stage.querySelector('.m-dialog');
  stage.querySelector('.mask').addEventListener('click', () => {
    dlg.classList.remove('shake');
    void dlg.offsetWidth;
    dlg.classList.add('shake');
  });
};
demo.toast = (stage, U) => {
  const box = stage.querySelector('.m-toasts');
  const msgs = ['修改已保存', '已同步到手机', '已通知 3 位学员'];
  let i = 0;
  const push = () => {
    const t = document.createElement('div');
    t.className = 'm-toast';
    t.setAttribute('role', 'status');
    t.innerHTML = '<b>✓</b>';
    t.append(msgs[i++ % msgs.length]);
    box.appendChild(t);
    t.addEventListener('animationend', (e) => { if (e.animationName === 'm-t-out') t.remove(); });
    while (box.children.length > 3) box.firstChild.remove();
  };
  stage.querySelector('.btn').addEventListener('click', push);
  U.auto(stage, push, 2800);
  stage.addEventListener('inview', push);
};
demo.notice = (stage, U) => {
  const push = () => {
    const old = stage.querySelector('.m-notice');
    if (old) old.remove();
    const n = document.createElement('div');
    n.className = 'm-notice';
    n.innerHTML = '<p class="m-title" style="font-size:14px">作业已批改</p><p class="m-text" style="font-size:12px">老师给「第 3 讲」写了评语。</p><button type="button" aria-label="关闭">×</button><span class="bar"></span>';
    const out = () => { n.classList.add('out'); setTimeout(() => n.remove(), 260); };
    n.querySelector('button').addEventListener('click', out);
    n.querySelector('.bar').addEventListener('animationend', out);
    stage.appendChild(n);
  };
  stage.querySelector('.btn').addEventListener('click', push);
  U.auto(stage, push, 7600);
  stage.addEventListener('inview', push);
};
demo.tips = (stage, U) => {
  const tips = [...stage.querySelectorAll('.m-tt')];
  let i = 0;
  stage.addEventListener('pointerenter', () => tips.forEach((t) => t.classList.remove('show')));
  U.auto(stage, () => {
    tips.forEach((t, n) => t.classList.toggle('show', n === i));
    i = (i + 1) % tips.length;
  }, 1500);
};
demo.lightbox = (stage, U) => {
  const img = stage.querySelector('.m-lb-img');
  const lb = stage.querySelector('.m-lb');
  const label = img.querySelector('span');
  const thumbs = [...stage.querySelectorAll('.m-thumbs button')];
  let current = null;
  const flip = (thumb, opening) => {
    const a = thumb.getBoundingClientRect();
    const b = img.getBoundingClientRect();
    const from = 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + (a.width / b.width) + ',' + (a.height / b.height) + ')';
    const frames = [{ transform: from }, { transform: 'none' }];
    return img.animate(opening ? frames : frames.reverse(), { duration: 340, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'both' });
  };
  const open = (thumb, n) => {
    current = thumb;
    img.className = 'm-lb-img ' + thumb.className;
    label.textContent = '第 ' + (n + 1) + ' 张 · 示例图';
    stage.classList.add('on');
    flip(thumb, true);
  };
  const close = () => {
    if (!current) return;
    const anim = flip(current, false);
    current = null;
    stage.classList.remove('on');
    anim.onfinish = () => anim.cancel();
  };
  thumbs.forEach((t, n) => t.addEventListener('click', () => open(t, n)));
  lb.addEventListener('click', close);
  stage.addEventListener('inview', () => open(thumbs[0], 0));
};

</script>
