<style>
:root { --stage-h: 290px; }
.f-col { width: min(84%, 270px); display: grid; gap: 14px; }
.f-field { position: relative; }
.f-input { width: 100%; padding: 12px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); outline: none; transition: border-color .2s, box-shadow .2s; }
.f-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }

.f-float .f-input { padding-top: 19px; padding-bottom: 6px; }

.f-float .f-input:focus + label, .f-float .f-input:not(:placeholder-shown) + label { transform: translateY(-8px) scale(.74); color: var(--accent); }

.f-pw { padding-right: 56px; }
.f-eye { position: absolute; right: 7px; top: 7px; border: 0; background: none; cursor: pointer; font-size: 13px; color: var(--accent); padding: 4px 6px; }
.f-str { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.f-str i { height: 5px; border-radius: 3px; background: var(--line); transition: background .25s; }
.f-str[data-n="1"] i:nth-child(-n+1) { background: var(--err); }
.f-str[data-n="2"] i:nth-child(-n+2) { background: var(--gold); }
.f-str[data-n="3"] i:nth-child(-n+3) { background: var(--gold); }
.f-str[data-n="4"] i { background: var(--ok); }
.f-small { font-size: 13px; color: var(--muted); min-height: 1.6em; }

.f-val.bad .f-input { border-color: var(--err); }
.f-val.good .f-input { border-color: var(--ok); }
.f-val.shake { animation: f-shake .36s; }
@keyframes f-shake { 25% { transform: translateX(-7px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.f-mark { position: absolute; right: 11px; top: 12px; font-weight: 700; color: var(--ok); transform: scale(0); transition: transform .25s cubic-bezier(.2, 1.6, .4, 1); }
.f-val.good .f-mark { transform: none; }
.f-msg { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s; font-size: 13px; color: var(--err); }
.f-msg span { overflow: hidden; }
.f-val.bad ~ .f-msg { grid-template-rows: 1fr; }

.f-search { position: relative; width: 170px; transition: width .2s cubic-bezier(.2, .9, .3, 1); }
.f-search:focus-within, .f-search.has { width: min(86%, 270px); }
.f-search .f-input { border-radius: 22px; padding: 9px 34px; }
.f-search svg { position: absolute; left: 12px; top: 12px; width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
.f-clear { position: absolute; right: 7px; top: 7px; width: 25px; height: 25px; border: 0; border-radius: 50%; background: var(--soft); cursor: pointer; font-size: 13px; line-height: 1; transform: scale(0); transition: transform .2s cubic-bezier(.2, 1.6, .4, 1); }
.f-search.has .f-clear { transform: none; }

.f-ta { resize: none; overflow: hidden; line-height: 1.6; height: 52px; transition: height .15s, border-color .2s, box-shadow .2s; display: block; }
.f-cnt { text-align: right; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.f-cnt.over { color: var(--err); font-weight: 700; }



.f-sel { position: relative; width: min(82%, 240px); align-self: start; margin-top: 26px; }
.f-sel-b { display: flex; justify-content: space-between; align-items: center; text-align: left; cursor: pointer; }
.f-sel-b .chev { transition: transform .2s; color: var(--muted); }
.on .f-sel-b .chev { transform: rotate(180deg); }
.on .f-sel-b { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.f-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 4; margin: 0; padding: 5px; list-style: none; background: var(--surface); border-radius: 11px; box-shadow: 0 12px 26px var(--shadow); max-height: 170px; overflow-y: auto; }
.f-sel .f-list { opacity: 0; visibility: hidden; transform: translateY(-7px) scaleY(.92); transform-origin: top; transition: opacity .16s, transform .16s, visibility 0s .16s; }
.on .f-sel .f-list { opacity: 1; visibility: visible; transform: none; transition: opacity .16s, transform .16s; }
.f-list button { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; text-align: left; padding: 5px 9px; border-radius: 7px; cursor: pointer; }
.f-list button:hover, .f-list button:focus-visible, .f-list button.act { background: var(--soft); }
.f-list [aria-selected="true"]::after { content: "✓"; color: var(--accent); font-weight: 700; }
.f-list mark { background: none; color: var(--accent); font-weight: 700; }
.f-none { padding: 6px 9px; font-size: 13px; color: var(--muted); }

.f-combo { position: relative; width: min(82%, 240px); align-self: start; margin-top: 26px; }
.f-combo .f-list button { display: block; }
.f-sel .f-list { max-height: 190px; }

.f-tags { width: min(88%, 290px); display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 8px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); cursor: text; transition: border-color .2s, box-shadow .2s; }
.f-tags:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.f-tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px 1px 10px; border-radius: 14px; background: var(--soft); font-size: 13px; animation: f-tag .28s cubic-bezier(.2, 1.6, .4, 1); }
.f-tag.out { animation: f-tag-o .15s forwards; }
@keyframes f-tag { from { transform: scale(.4); opacity: 0; } }
@keyframes f-tag-o { to { transform: scale(.4); opacity: 0; } }
.f-tag button { border: 0; background: none; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; color: var(--muted); }
.f-tags input { flex: 1; min-width: 80px; border: 0; outline: 0; background: none; padding: 2px; font-size: 14px; }


.f-rate { display: grid; justify-items: center; gap: 8px; }
.f-stars { display: flex; gap: 2px; }
.f-stars button { border: 0; background: none; cursor: pointer; padding: 3px; }
.f-stars svg { display: block; width: 34px; height: 34px; fill: var(--line); transition: fill .12s, transform .12s; }
.f-stars button.lit svg { fill: var(--gold); }
.f-stars button:hover svg { transform: scale(1.14); }
.f-stars button.pop svg { animation: f-star .4s calc(var(--i) * 45ms) cubic-bezier(.2, 1.7, .4, 1); }
@keyframes f-star { 40% { transform: scale(1.4) rotate(-14deg); } }

.f-cal { width: min(90%, 258px); background: var(--surface); padding: 8px 10px; border-radius: 12px; box-shadow: 0 6px 18px var(--shadow); overflow: hidden; }
.f-cal-h { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
.f-cal-h button { border: 0; background: none; cursor: pointer; padding: 1px 9px; font-size: 16px; border-radius: 6px; }
.f-cal-h button:hover { background: var(--soft); }
.f-cal-g { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12.5px; }
.f-cal-g span { color: var(--muted); font-size: 11.5px; line-height: 22px; }
.f-cal-g button { height: 27px; border: 0; background: none; border-radius: 50%; cursor: pointer; font-variant-numeric: tabular-nums; transition: background .12s; aspect-ratio: 1; padding: 0; justify-self: center; font-size: 12.5px; }
.f-cal-g button:hover { background: var(--soft); }
.f-cal-g button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.f-cal-g button.sel { background: var(--accent); color: var(--accent-ink); animation: f-star .3s; }
.f-cal-g.next { animation: f-cal-n .22s ease-out; } .f-cal-g.prev { animation: f-cal-p .22s ease-out; }
@keyframes f-cal-n { from { transform: translateX(30px); opacity: 0; } }
@keyframes f-cal-p { from { transform: translateX(-30px); opacity: 0; } }

.f-up { width: min(86%, 280px); display: grid; gap: 9px; }
.f-drop { display: block; width: 100%; padding: 22px 12px; border: 2px dashed var(--line); border-radius: 13px; text-align: center; font-size: 14px; color: var(--muted); background: transparent; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
.f-drop:hover, .f-drop.over { border-color: var(--accent); background: var(--soft); color: var(--ink); }
.f-drop.over { transform: scale(1.03); }
.f-drop b { display: block; font-size: 22px; line-height: 1.2; color: var(--accent); }
.f-file { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 13px; padding: 7px 10px; background: var(--surface); border-radius: 9px; animation: f-tag .3s; }
.f-file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-file em { font: 12px var(--mono); font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.f-file em.ok { color: var(--ok); font-weight: 700; }
.f-file i { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.f-file i::after { content: ""; display: block; height: 100%; width: var(--w, 0%); background: var(--accent); }
.f-otp { display: flex; gap: 6px; }
.f-otp input { width: 38px; height: 46px; text-align: center; font: 700 19px var(--mono); border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s, transform .15s; padding: 0; }
.f-otp input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.f-otp input.has { border-color: var(--accent); }
.f-otp.done input { border-color: var(--ok); }
.f-otp.done input:nth-child(n) { animation: f-otp-ok .35s calc(var(--i) * 40ms); }
@keyframes f-otp-ok { 40% { transform: translateY(-6px); } }
.f-file .x { grid-column: 2; grid-row: 1; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 15px; line-height: 1; }
.f-file.bad { box-shadow: inset 0 0 0 1px var(--err); }
.f-file.bad em { color: var(--err); grid-column: 1 / -1; }

.f-cal-g button.in { background: var(--soft); border-radius: 4px; }
.f-cal-note { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

.f-rg2 { width: min(84%, 260px); display: grid; gap: 12px; }
.f-rg2 label { font-size: 13px; color: var(--muted); }
.f-dual { position: relative; height: 24px; }
.f-dual .tr { position: absolute; left: 0; right: 0; top: 8px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--line) var(--a), var(--accent) var(--a), var(--accent) var(--b), var(--line) var(--b)); }
.f-dual input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; -webkit-appearance: none; appearance: none; pointer-events: none; }
.f-dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 2px 6px var(--shadow); cursor: pointer; transition: transform .15s; }
.f-dual input::-moz-range-thumb { pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 2px 6px var(--shadow); cursor: pointer; }
.f-dual input:active::-webkit-slider-thumb { transform: scale(1.2); }
.f-nums { display: grid; grid-template-columns: 1fr auto 1fr; gap: 7px; align-items: center; color: var(--muted); }
.f-nums input { width: 100%; min-width: 0; padding: 6px 9px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font: 14px var(--mono); }

.f-cas { position: relative; width: min(90%, 290px); align-self: start; margin-top: 18px; }
.f-cas-p { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 4; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 11px; box-shadow: 0 12px 26px var(--shadow); overflow: hidden; opacity: 0; visibility: hidden; transform: translateY(-7px); transition: opacity .15s, transform .15s, visibility 0s .15s; }
.on .f-cas-p { opacity: 1; visibility: visible; transform: none; transition: opacity .15s, transform .15s; }
.f-cas-c { display: grid; align-content: start; padding: 4px; min-height: 150px; border-left: 1px solid var(--line); }
.f-cas-c:first-child { border-left: 0; }
.f-cas-c button { display: flex; justify-content: space-between; border: 0; background: none; padding: 5px 7px; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left; animation: f-cas-in .18s ease-out; }
.f-cas-c button:hover { background: var(--stage); }
.f-cas-c button.act { background: var(--soft); color: var(--accent); font-weight: 600; }
@keyframes f-cas-in { from { opacity: 0; transform: translateX(-7px); } }
.f-cas-b { display: flex; justify-content: space-between; align-items: center; text-align: left; cursor: pointer; }

.f-help { display: grid; gap: 5px; width: min(84%, 270px); }
.f-help label { font-size: 14px; font-weight: 600; }
.f-help small { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.f-form { width: min(84%, 270px); display: grid; gap: 10px; }
.f-form label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
.f-form .req { color: var(--err); margin-left: 2px; display: inline-block; animation: f-req 2.4s ease-in-out infinite; }
@keyframes f-req { 0%, 70%, 100% { transform: none; } 80% { transform: scale(1.5); } }
.f-form .opt { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.f-form .f-input { padding-block: 8px; }
.f-sub { display: grid; gap: 10px; width: min(84%, 270px); }
.f-sub .btn { height: 42px; }
.f-sub .btn[disabled] { opacity: .75; cursor: default; }
</style>
<h2 class="group">填内容和传文件</h2>
<article class="sp" data-name="输入框和提交按钮" data-en="Input & Submit" data-demo="submit" data-hint="点提交" data-use="表单的最小组合，AI 不用提示也做得出来，一般不必多说。" data-prompt="做一个输入框加提交按钮：输入框聚焦时边框变橙并有浅色外圈；点提交后按钮转圈、暂时不能再点，返回结果后显示「已提交」。">
  <div class="stage"><form class="f-sub"><input class="f-input" id="f-sb" aria-label="昵称" placeholder="你的昵称" value="林小满" autocomplete="off"><button class="btn" type="submit">提交</button></form></div>
</article>
<article class="sp" data-name="浮动标签" data-en="Floating Label" data-hint="点空的那一格" data-use="字段名先待在框里，一点进去就缩到框的上沿，填的时候也不会丢。" data-prompt="做一个浮动标签（Floating Label）输入框：标签默认在框内，聚焦或有内容时缩小到 74% 并移到左上方变橙色，180ms，始终保持可见。">
  <div class="stage"><div class="f-col"><div class="f-field f-float"><input class="f-input" id="f-name" placeholder=" " value="林小满"><label for="f-name">姓名</label></div><div class="f-field f-float"><input class="f-input" id="f-city" placeholder=" "><label for="f-city">所在城市</label></div></div></div>
</article>
<article class="sp" data-name="搜索框" data-en="Search Field" data-demo="search" data-hint="点进去，再输入" data-use="平时收得短，点进去才展开。有内容时才出现清空按钮。" data-prompt="做一个可展开搜索框：胶囊形，左侧放大镜；聚焦时宽度从 170px 展开，200ms；有内容时右侧弹出清空按钮。">
  <div class="stage"><div class="f-search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="M16 16l5 5"/></svg><input class="f-input" id="f-q" placeholder="搜索课程" aria-label="搜索课程" autocomplete="off"><button class="f-clear" type="button" aria-label="清空">×</button></div></div>
</article>
<article class="sp" data-name="自增高文本域" data-en="Auto-grow Textarea" data-demo="textarea" data-hint="多写几行" data-use="写长文字时框跟着变高，不出现内部滚动条。右下角提示还能写多少字。" data-prompt="做一个自增高文本域：高度随内容平滑变高，不出现滚动条；右下角显示「字数 / 120」，超过上限时数字变红。">
  <div class="stage"><div class="f-col" style="gap:5px"><textarea class="f-input f-ta" id="f-ta" aria-label="课程反馈" rows="1">这节课讲得很清楚，想再多一些实操案例。</textarea><div class="f-cnt"></div></div></div>
</article>

  <div class="stage"><div class="f-tags"><input id="f-tag" placeholder="加一个标签" aria-label="添加标签" autocomplete="off"></div></div>
</article>

  <div class="stage"><div class="f-col" style="justify-items:center;width:auto"><div class="f-otp" role="group" aria-label="验证码"><input id="f-o1" inputmode="numeric" maxlength="1" aria-label="第 1 位" autocomplete="off" style="--i:0"><input id="f-o2" inputmode="numeric" maxlength="1" aria-label="第 2 位" autocomplete="off" style="--i:1"><input id="f-o3" inputmode="numeric" maxlength="1" aria-label="第 3 位" autocomplete="off" style="--i:2"><input id="f-o4" inputmode="numeric" maxlength="1" aria-label="第 4 位" autocomplete="off" style="--i:3"><input id="f-o5" inputmode="numeric" maxlength="1" aria-label="第 5 位" autocomplete="off" style="--i:4"><input id="f-o6" inputmode="numeric" maxlength="1" aria-label="第 6 位" autocomplete="off" style="--i:5"></div><div class="f-small">短信验证码已发送</div></div></div>
</article>

  <div class="stage"><div class="f-up"><button class="f-drop" type="button" style="padding-block:13px"><b>↑</b>把文件拖到这里，或点击模拟上传</button><div class="f-files" style="display:grid;gap:6px"></div></div></div>
</article>

</article>

  <div class="stage"><div class="f-combo"><input class="f-input" id="f-combo" value="上" role="combobox" aria-expanded="true" aria-label="城市" autocomplete="off"><ul class="f-list"></ul></div></div>

<script>
demo.search = (stage) => {
  const box = stage.querySelector('.f-search');
  const input = box.querySelector('input');
  input.addEventListener('input', () => box.classList.toggle('has', !!input.value));
  box.querySelector('.f-clear').addEventListener('click', () => { input.value = ''; box.classList.remove('has'); input.focus(); });
};
demo.textarea = (stage) => {
  const ta = stage.querySelector('textarea');
  const cnt = stage.querySelector('.f-cnt');
  const MAX = 120;
  const fit = () => {
    ta.style.height = 'auto';
    const h = Math.min(ta.scrollHeight + 3, 180);
    ta.style.height = h + 'px';
    cnt.textContent = ta.value.length + ' / ' + MAX;
    cnt.classList.toggle('over', ta.value.length > MAX);
  };
  ta.addEventListener('input', fit);
  fit();
};
demo.select = (stage) => {
  const label = stage.querySelector('.f-sel-b span');
  const opts = [...stage.querySelectorAll('[role=option]')];
  opts.forEach((o) => o.addEventListener('click', () => {
    opts.forEach((x) => x.setAttribute('aria-selected', String(x === o)));
    label.textContent = o.textContent;
    stage.classList.remove('on');
  }));
  document.addEventListener('click', (e) => { if (stage.dataset.touched && !stage.contains(e.target)) stage.classList.remove('on'); });
};
demo.combo = (stage) => {
  const CITIES = ['上海', '上饶', '北京', '广州', '深圳', '杭州', '杭锦旗', '南京', '成都', '武汉', '苏州', '西安'];
  const input = stage.querySelector('input');
  const list = stage.querySelector('.f-list');
  let active = 0, shown = [];
  const render = () => {
    const q = input.value.trim();
    shown = CITIES.filter((c) => c.includes(q)).slice(0, 4);
    list.replaceChildren();
    if (!shown.length) { const li = document.createElement('li'); li.className = 'f-none'; li.textContent = '没有匹配的城市'; list.appendChild(li); return; }
    shown.forEach((c, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button'; b.tabIndex = -1;
      if (i === active) b.className = 'act';
      const at = q ? c.indexOf(q) : -1;
      if (at >= 0) { b.append(c.slice(0, at)); const m = document.createElement('mark'); m.textContent = q; b.append(m, c.slice(at + q.length)); } else b.textContent = c;
      b.addEventListener('click', () => choose(c));
      li.appendChild(b);
      list.appendChild(li);
    });
  };
  const choose = (c) => { input.value = c; active = 0; render(); };
  input.addEventListener('input', () => { active = 0; render(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % (shown.length || 1); render(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); active = (active - 1 + (shown.length || 1)) % (shown.length || 1); render(); }
    if (e.key === 'Enter' && shown[active]) { e.preventDefault(); choose(shown[active]); }
  });
  render();
};
demo.tags = (stage) => {
  const box = stage.querySelector('.f-tags');
  const input = box.querySelector('input');
  const has = (t) => [...box.querySelectorAll('.f-tag span')].some((s) => s.textContent === t);
  const remove = (el) => { el.classList.add('out'); el.addEventListener('animationend', () => el.remove(), { once: true }); };
  const add = (t) => {
    if (!t || has(t)) return;
    const tag = document.createElement('div');
    tag.className = 'f-tag';
    const label = document.createElement('span'); label.textContent = t;
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', '删除 ' + t);
    x.addEventListener('click', () => remove(tag));
    tag.append(label, x);
    box.insertBefore(tag, input);
  };
  ['提示词', '动效', '零基础'].forEach(add);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); add(input.value.trim()); input.value = ''; }
    const tags = box.querySelectorAll('.f-tag');
    if (e.key === 'Backspace' && !input.value && tags.length) remove(tags[tags.length - 1]);
  });
};
demo.rating = (stage) => {
  const WORDS = ['不太满意', '一般', '还行', '满意', '非常满意'];
  const row = stage.querySelector('.f-stars');
  const tip = stage.querySelector('.f-small');
  let score = 4;
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.4 6.7L12 17.5 5.9 20.800l1.4-6.700-5-4.600 6.800-.800z"/></svg>';
  const btns = WORDS.map((w, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.innerHTML = STAR; b.style.setProperty('--i', i); b.setAttribute('aria-label', (i + 1) + ' 星：' + w);
    row.appendChild(b);
    return b;
  });
  const paint = (n) => btns.forEach((b, i) => b.classList.toggle('lit', i < n));
  btns.forEach((b, i) => {
    b.addEventListener('pointerenter', () => paint(i + 1));
    b.addEventListener('click', () => {
      score = i + 1;
      paint(score);
      tip.textContent = WORDS[i];
      btns.forEach((x) => x.classList.remove('pop'));
      void row.offsetWidth;
      btns.forEach((x, n) => { if (n <= i) x.classList.add('pop'); });
    });
  });
  row.addEventListener('pointerleave', () => paint(score));
  paint(score);
  tip.textContent = WORDS[score - 1];
};
demo.otp = (stage, U) => {
  const box = stage.querySelector('.f-otp');
  const cells = [...box.querySelectorAll('input')];
  const tip = stage.querySelector('.f-small');
  const refresh = () => {
    cells.forEach((c) => c.classList.toggle('has', !!c.value));
    const done = cells.every((c) => c.value);
    box.classList.toggle('done', done);
    tip.textContent = done ? '验证通过' : '短信验证码已发送';
  };
  const fill = (digits, from) => {
    [...digits].slice(0, cells.length - from).forEach((d, i) => { cells[from + i].value = d; });
    refresh();
  };
  cells.forEach((c, i) => {
    c.addEventListener('input', () => {
      c.value = c.value.replace(/\D/g, '').slice(-1);
      if (c.value && cells[i + 1]) cells[i + 1].focus();
      refresh();
    });
    c.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !c.value && cells[i - 1]) { cells[i - 1].focus(); cells[i - 1].value = ''; refresh(); e.preventDefault(); }
    });
    c.addEventListener('paste', (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
      fill(digits, i);
      cells[Math.min(cells.length - 1, i + digits.length)].focus();
    });
  });
  // Idle demo: digits type themselves in, then clear and repeat.
  const SAMPLE = '482915';
  let n = 0;
  U.auto(stage, () => {
    if (n > SAMPLE.length + 3) { cells.forEach((c) => { c.value = ''; }); n = 0; refresh(); return; }
    if (n < SAMPLE.length) cells[n].value = SAMPLE[n];
    n++;
    refresh();
  }, 380);
};
demo.upload = (stage, U) => {
  const drop = stage.querySelector('.f-drop');
  const files = stage.querySelector('.f-files');
  const addBad = () => {
    const row = document.createElement('div');
    row.className = 'f-file bad';
    const label = document.createElement('span'); label.textContent = '安装包.exe';
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', '移除这个文件');
    x.addEventListener('click', () => row.remove());
    const why = document.createElement('em'); why.textContent = '格式不支持，只能传 PDF 或图片';
    row.append(label, x, why);
    files.appendChild(row);
  };
  let runId = 0;
  const run = (name) => {
    const id = ++runId; // A newer upload supersedes this one, so its finish must not add rows.
    files.replaceChildren();
    const row = document.createElement('div');
    row.className = 'f-file';
    const label = document.createElement('span'); label.textContent = name;
    const pct = document.createElement('em');
    const bar = document.createElement('i');
    row.append(label, pct, bar);
    files.appendChild(row);
    U.tween(1400, (p) => {
      bar.style.setProperty('--w', (p * 100) + '%');
      pct.textContent = Math.round(p * 100) + '%';
    }, () => {
      if (id !== runId) return;
      pct.textContent = '✓ 完成'; pct.className = 'ok'; addBad();
    });
  };
  drop.addEventListener('click', () => run('课程大纲-示例.pdf'));
  ['dragenter', 'dragover'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((n) => drop.addEventListener(n, () => drop.classList.remove('over')));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    run(f ? f.name : '未命名文件');
  });
  stage.addEventListener('inview', () => run('课程大纲-示例.pdf'));
};
demo.calendar = (stage) => {
  const grid = stage.querySelector('.f-cal-g');
  const title = stage.querySelector('.t');
  const note = stage.querySelector('.f-cal-note');
  const today = new Date();
  let y = today.getFullYear(), m = today.getMonth();
  let start = null, end = null;
  const stamp = (yy, mm, dd) => new Date(yy, mm, dd).getTime();
  const fmt = (t) => { const d = new Date(t); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; };
  const describe = () => {
    if (start === null) note.textContent = '选择入住日期';
    else if (end === null) note.textContent = '入住 ' + fmt(start) + '，再选离店日期';
    else note.textContent = '入住 ' + fmt(start) + ' → 离店 ' + fmt(end) + '，共 ' + Math.round((end - start) / 864e5) + ' 晚';
  };
  const render = (dir) => {
    title.textContent = y + ' 年 ' + (m + 1) + ' 月';
    grid.replaceChildren();
    grid.classList.remove('next', 'prev');
    '日一二三四五六'.split('').forEach((w) => { const s = document.createElement('span'); s.textContent = w; grid.appendChild(s); });
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) grid.appendChild(document.createElement('i'));
    for (let d = 1; d <= days; d++) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = d;
      const t = stamp(y, m, d);
      if (t === stamp(today.getFullYear(), today.getMonth(), today.getDate())) b.classList.add('today');
      if (t === start || t === end) b.classList.add('sel');
      else if (start !== null && end !== null && t > start && t < end) b.classList.add('in');
      b.addEventListener('click', () => {
        if (start === null || end !== null || t <= start) { start = t; end = null; } else end = t;
        render(0);
        describe();
      });
      grid.appendChild(b);
    }
    if (dir) { void grid.offsetWidth; grid.classList.add(dir > 0 ? 'next' : 'prev'); }
  };
  stage.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => {
    const dir = +b.dataset.m;
    m += dir;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    render(dir);
  }));
  render(0);
};
demo.range = (stage, U) => {
  const dual = stage.querySelector('.f-dual');
  const lo = stage.querySelector('#f-lo'), hi = stage.querySelector('#f-hi');
  const loN = stage.querySelector('#f-lon'), hiN = stage.querySelector('#f-hin');
  const MAX = 1000, GAP = 50;
  const paint = () => {
    dual.style.setProperty('--a', (lo.value / MAX * 100) + '%');
    dual.style.setProperty('--b', (hi.value / MAX * 100) + '%');
    loN.value = lo.value; hiN.value = hi.value;
  };
  // Keep the two handles from crossing, whichever one moved.
  lo.addEventListener('input', () => { lo.value = Math.min(+lo.value, +hi.value - GAP); paint(); });
  hi.addEventListener('input', () => { hi.value = Math.max(+hi.value, +lo.value + GAP); paint(); });
  loN.addEventListener('change', () => { lo.value = Math.min(+loN.value, +hi.value - GAP); paint(); });
  hiN.addEventListener('change', () => { hi.value = Math.max(+hiN.value, +lo.value + GAP); paint(); });
  paint();
  stage.addEventListener('inview', () => {
    U.tween(1200, (p) => { lo.value = 200 + Math.sin(p * Math.PI) * 180; hi.value = 600 + Math.sin(p * Math.PI) * 220; paint(); });
  });
};
demo.cascader = (stage) => {
  const DATA = { 上海: { 上海市: ['浦东新区', '徐汇区', '静安区'] }, 浙江: { 杭州: ['西湖区', '滨江区', '余杭区'], 宁波: ['海曙区', '鄞州区'] }, 广东: { 广州: ['天河区', '越秀区'], 深圳: ['南山区', '福田区'] } };
  const cols = [...stage.querySelectorAll('.f-cas-c')];
  const label = stage.querySelector('.f-cas-b span');
  const path = [];
  const fill = (col, items, active, onPick) => {
    col.replaceChildren();
    items.forEach((name) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = name;
      if (name === active) b.className = 'act';
      b.addEventListener('click', () => onPick(name));
      col.appendChild(b);
    });
  };
  const render = () => {
    const [prov, city] = path;
    fill(cols[0], Object.keys(DATA), prov, (n) => { path.length = 0; path.push(n); render(); });
    fill(cols[1], prov ? Object.keys(DATA[prov]) : [], city, (n) => { path.length = 1; path.push(n); render(); });
    fill(cols[2], prov && city ? DATA[prov][city] : [], null, (n) => {
      label.textContent = prov + ' / ' + city + ' / ' + n;
      stage.classList.remove('on');
    });
  };
  path.push('浙江', '杭州');
  render();
};
demo.password = (stage) => {
  const input = stage.querySelector('input');
  const eye = stage.querySelector('.f-eye');
  const bars = stage.querySelector('.f-str');
  const tip = stage.querySelector('.f-small');
  const WORDS = ['太弱了', '有点弱', '还可以', '够强了'];
  const score = (v) => [v.length >= 8, /[a-z]/.test(v) && /[A-Z]/.test(v), /\d/.test(v), /[^\w]/.test(v)].filter(Boolean).length;
  const update = () => {
    const n = input.value ? Math.max(1, score(input.value)) : 0;
    bars.dataset.n = n;
    tip.textContent = n ? '强度：' + WORDS[n - 1] : '至少 8 位，混合大小写、数字和符号';
  };
  eye.addEventListener('click', () => {
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(hidden));
    eye.setAttribute('aria-label', hidden ? '隐藏密码' : '显示密码');
    eye.style.opacity = hidden ? 1 : .55;
  });
  eye.style.opacity = .55;
  input.addEventListener('input', update);
  update();
};
demo.validate = (stage) => {
  const input = stage.querySelector('input');
  const box = stage.querySelector('.f-val');
  const ok = () => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value);
  // Check only after the viewer leaves the field: never scold while they are still typing.
  input.addEventListener('input', () => box.classList.remove('bad', 'good', 'shake'));
  input.addEventListener('blur', () => {
    if (!input.value) return;
    box.classList.toggle('good', ok());
    box.classList.toggle('bad', !ok());
    if (ok()) return;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  });
};
demo.submit = (stage) => {
  const form = stage.querySelector('form');
  const btn = form.querySelector('.btn');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = '提交中';
    setTimeout(() => {
      btn.textContent = '✓ 已提交';
      setTimeout(() => { btn.disabled = false; btn.textContent = '提交'; }, 1500);
    }, 1000);
  });
};
</script>
