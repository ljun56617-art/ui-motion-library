<!doctype html>
<!--
名称：底部弹层（Bottom Sheet）
编号：02-modals/05
什么时候用：贴着手机屏幕底边升起来，大拇指够得着。
一句话提示词：做一个底部弹层（Bottom Sheet）：从屏幕底部滑上来，顶部圆角加一条小横杠，里面放 4 个分享入口，300ms，点遮罩收回。
操作提示：点遮罩关闭
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>底部弹层</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.btn { border: 0; border-radius: 10px; padding: 10px 20px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; transition: transform .15s, box-shadow .15s, background .2s, color .2s; }
.fake { position: absolute; inset: 0; z-index: -1; padding: 14px; display: grid; align-content: start; gap: 9px; }
.fake i { display: block; height: 10px; border-radius: 5px; background: var(--line); opacity: .55; }
.fake i:nth-child(1) { width: 42%; height: 15px; }
.fake i:nth-child(2) { width: 92%; }
.fake i:nth-child(3) { width: 78%; }
.fake i:nth-child(4) { width: 86%; }
.fake i:nth-child(5) { width: 60%; }
.fake i:nth-child(6) { width: 88%; }
.fake i:nth-child(7) { width: 70%; }
.fake i:nth-child(8) { width: 82%; }
.fake i:nth-child(9) { width: 52%; }
.mask { position: absolute; inset: 0; z-index: 5; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
.on .mask { opacity: 1; visibility: visible; transition: opacity .25s; }
.pop { position: absolute; z-index: 6; background: var(--surface); box-shadow: 0 14px 30px var(--shadow); visibility: hidden; }
.on .pop { visibility: visible; }
.m-sheet { left: 0; right: 0; bottom: 0; padding: 8px 16px 16px; border-radius: 16px 16px 0 0; transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .9, .3, 1), visibility 0s .3s; }
.on .m-sheet { transform: none; transition: transform .3s cubic-bezier(.2, .9, .3, 1); }
.m-grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.m-share { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: 12px; }
.m-share button { display: grid; justify-items: center; gap: 3px; border: 0; background: none; cursor: pointer; padding: 0; }
.m-share i { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, var(--art3), var(--art1)); }
.m-share button:nth-child(2) i { background: linear-gradient(145deg, var(--art1), var(--art2)); }
.m-share button:nth-child(3) i { background: var(--soft); }
.m-share button:nth-child(4) i { background: var(--accent-deep); }
</style></head>
<body><article class="sp" data-name="底部弹层" data-en="Bottom Sheet" data-auto data-hint="点遮罩关闭" data-use="贴着手机屏幕底边升起来，大拇指够得着。" data-prompt="做一个底部弹层（Bottom Sheet）：从屏幕底部滑上来，顶部圆角加一条小横杠，里面放 4 个分享入口，300ms，点遮罩收回。"><div class="stage"><div class="fake"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <button class="btn" type="button" data-open style="margin-bottom:60px">分享</button>
    <div class="mask" data-close></div>
    <div class="pop m-sheet"><div class="m-grab"></div><div class="m-share"><button type="button" data-close><i></i>好友</button><button type="button" data-close><i></i>朋友圈</button><button type="button" data-close><i></i>复制链接</button><button type="button" data-close><i></i>海报</button></div></div></div></article>
<script>window.demo = {};

</script>
<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFrozen = (stage) => reduced || stage.closest('.sp').classList.contains('off');
  const U = {
    loop(stage, fn, ms) { setInterval(() => { if (!isFrozen(stage)) fn(); }, ms); },
    auto(stage, fn, ms) { U.loop(stage, () => { if (!stage.dataset.touched) fn(); }, ms); },
    frame(stage, fn) { const step = (t) => { if (!isFrozen(stage)) fn(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
    tween(ms, fn, done) {
      const start = performance.now();
      const step = (now) => { const p = Math.min(1, (now - start) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); };
      requestAnimationFrame(step);
    },
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
  };
  const card = document.querySelector('.sp');
  const stage = card.querySelector('.stage');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle],[data-open],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-toggle')) stage.classList.toggle('on');
    else if (t.hasAttribute('data-open')) stage.classList.add('on');
    else stage.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stage.classList.remove('on'); });
  stage.addEventListener('pointerdown', () => { stage.dataset.touched = '1'; }, true);
  stage.addEventListener('focusin', () => { stage.dataset.touched = '1'; }, true);
  const fn = window.demo[card.dataset.demo];
  if (card.dataset.demo && !fn) console.error('missing demo: ' + card.dataset.demo);
  if (fn) fn(stage, U);
  let seen = false;
  new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      card.classList.toggle('off', !en.isIntersecting);
      if (!en.isIntersecting || seen) return;
      seen = true;
      setTimeout(() => {
        if (stage.dataset.touched) return;
        if (card.hasAttribute('data-auto')) stage.classList.add('on');
        stage.dispatchEvent(new Event('inview'));
      }, 450);
    });
  }, { threshold: 0.15 }).observe(card);
})();
</script>
</body></html>
