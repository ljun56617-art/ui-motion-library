<!doctype html>
<!--
名称：弹跳（Bounce）
编号：03-motion/21
什么时候用：活泼的提示，引导往下滑、提示点这里。落地时压扁才有重量感。
关键参数：1.5s · 落地压扁 1.25 / 0.72 · 循环
一句话提示词：做一个弹跳小球：下落加速、上升减速，落地瞬间横向拉伸 1.25、纵向压到 0.72，地上的影子跟着变大变小。
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>弹跳</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.a-bounce-box { display: grid; justify-items: center; }
.a-ball { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--art3), var(--art1) 60%, var(--art2)); animation: a-ball 1.5s infinite; transform-origin: 50% 100%; }
.a-shadow { width: 62px; height: 9px; margin-top: 5px; border-radius: 50%; background: var(--shadow); animation: a-sh 1.5s infinite; }
@keyframes a-ball { 0%, 100% { transform: translateY(-110px); animation-timing-function: cubic-bezier(.5, 0, .9, .5); }
  46% { transform: translateY(0) scale(1, 1); animation-timing-function: linear; }
  50% { transform: translateY(0) scale(1.25, .72); animation-timing-function: linear; }
  54% { transform: translateY(0) scale(1, 1); animation-timing-function: cubic-bezier(.1, .5, .5, 1); } }
@keyframes a-sh { 0%, 100% { transform: scale(.45); opacity: .4; } 50% { transform: none; opacity: 1; } }
</style></head>
<body><article class="sp" data-name="弹跳" data-en="Bounce" data-params="1.5s · 落地压扁 1.25 / 0.72 · 循环" data-use="活泼的提示，引导往下滑、提示点这里。落地时压扁才有重量感。" data-prompt="做一个弹跳小球：下落加速、上升减速，落地瞬间横向拉伸 1.25、纵向压到 0.72，地上的影子跟着变大变小。"><div class="stage"><div class="a-bounce-box"><div class="a-ball"></div><div class="a-shadow"></div></div></div></article>
</body></html>
