<!doctype html>
<!--
名称：滚动叙事（Scroll Storytelling）
编号：03-motion/16
什么时候用：画面钉在屏幕上，下滑时里面的内容分步切换，适合讲产品流程。
关键参数：position: sticky · 按滚动进度切步骤
一句话提示词：做滚动叙事（Scroll Storytelling）：画面用 sticky 固定，滚动时不动，内部图形和文字按滚动进度一步步变化，共 4 步，每步有过渡。
操作提示：滚动这个框
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>滚动叙事</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.a-sbox { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: thin; }
.a-track { height: 500%; }
.a-pin { position: sticky; top: 0; height: var(--stage-h); display: grid; justify-items: center; align-content: center; gap: 12px; padding-inline: 14px; }
.a-shape { width: 74px; height: 74px; background: linear-gradient(145deg, var(--art3), var(--art1)); border-radius: 14px; transition: border-radius .35s, transform .35s, background .35s; }
.a-pin[data-s="1"] .a-shape { border-radius: 50%; transform: scale(1.15); }
.a-pin[data-s="2"] .a-shape { border-radius: 50% 50% 12% 12%; transform: rotate(45deg); }
.a-pin[data-s="3"] .a-shape { border-radius: 14px; transform: scale(1.3, .7); background: linear-gradient(145deg, var(--art1), var(--art2)); }
.a-step { font-size: 14px; font-weight: 600; text-align: center; min-height: 1.6em; }
.a-dots { display: flex; gap: 6px; }
.a-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
.a-dots i.on { background: var(--accent); transform: scale(1.25); }
</style></head>
<body><article class="sp" data-name="滚动叙事" data-en="Scroll Storytelling" data-demo="story" data-hint="滚动这个框" data-params="position: sticky · 按滚动进度切步骤" data-use="画面钉在屏幕上，下滑时里面的内容分步切换，适合讲产品流程。" data-prompt="做滚动叙事（Scroll Storytelling）：画面用 sticky 固定，滚动时不动，内部图形和文字按滚动进度一步步变化，共 4 步，每步有过渡。"><div class="stage"><div class="a-sbox" tabindex="0" aria-label="滚动示例"><div class="a-track"><div class="a-pin" data-s="0"><div class="a-shape"></div><div class="a-step"></div><div class="a-dots"><i></i><i></i><i></i><i></i></div></div></div></div></div></article>
<script>window.demo = {};
function autoScroll(stage, box, U, speed) {
  let pos = 0, dir = 1;
  U.frame(stage, () => {
    if (stage.dataset.touched) return;
    const max = box.scrollHeight - box.clientHeight;
    pos += dir * speed;
    if (pos >= max) { pos = max; dir = -1; } else if (pos <= 0) { pos = 0; dir = 1; }
    box.scrollTop = pos;
  });
}
demo.story = (stage, U) => {
  const STEPS = ['第 1 步：先有一个想法', '第 2 步：想法变圆润', '第 3 步：换个角度看', '第 4 步：压扁成产品'];
  const box = stage.querySelector('.a-sbox');
  const pin = stage.querySelector('.a-pin');
  const label = stage.querySelector('.a-step');
  const dots = [...stage.querySelectorAll('.a-dots i')];
  const update = () => {
    const p = box.scrollTop / (box.scrollHeight - box.clientHeight || 1);
    const s = Math.min(STEPS.length - 1, Math.floor(p * STEPS.length));
    pin.dataset.s = s;
    label.textContent = STEPS[s];
    dots.forEach((d, i) => d.classList.toggle('on', i === s));
  };
  box.addEventListener('scroll', update);
  update();
  autoScroll(stage, box, U, .8);
};
</script>
<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFrozen = (stage) => reduced || stage.closest('.sp').classList.contains('off');
  const U = {
    loop(stage, fn, ms) { setInterval(() => { if (!isFrozen(stage)) fn(); }, ms); },
    auto(stage, fn, ms) { U.loop(stage, () => { if (!stage.dataset.touched) fn(); }, ms); },
    frame(stage, fn) { const step = (t) => { if (!isFrozen(stage)) fn(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
    tween(ms, fn, done) {
      const start = performance.now();
      const step = (now) => { const p = Math.min(1, (now - start) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); };
      requestAnimationFrame(step);
    },
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
  };
  const card = document.querySelector('.sp');
  const stage = card.querySelector('.stage');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle],[data-open],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-toggle')) stage.classList.toggle('on');
    else if (t.hasAttribute('data-open')) stage.classList.add('on');
    else stage.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stage.classList.remove('on'); });
  stage.addEventListener('pointerdown', () => { stage.dataset.touched = '1'; }, true);
  stage.addEventListener('focusin', () => { stage.dataset.touched = '1'; }, true);
  const fn = window.demo[card.dataset.demo];
  if (card.dataset.demo && !fn) console.error('missing demo: ' + card.dataset.demo);
  if (fn) fn(stage, U);
  let seen = false;
  new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      card.classList.toggle('off', !en.isIntersecting);
      if (!en.isIntersecting || seen) return;
      seen = true;
      setTimeout(() => {
        if (stage.dataset.touched) return;
        if (card.hasAttribute('data-auto')) stage.classList.add('on');
        stage.dispatchEvent(new Event('inview'));
      }, 450);
    });
  }, { threshold: 0.15 }).observe(card);
})();
</script>
</body></html>
