<!doctype html>
<!--
名称：滑块（Slider）
编号：04-forms/12
什么时候用：拖两个把手定一个大致范围，比如价格。要准确数字就旁边再配输入框。
关键参数：两端橡皮筋 · 弹簧弹回 · 范围内松手即停
一句话提示词：做一个价格区间滑块（Slider）：两个把手，中间段橙色，按住把手放大 1.2 倍；下方两个数字输入框和把手双向同步，方便输入精确数值。把手拉过两头或顶到另一个把手时用橡皮筋阻力（系数 0.55），松手用弹簧动画（刚度 300、阻尼比 1）带着松手速度弹回边界；在范围内松手就停在原地，不要惯性滑走。把手支持方向键。
操作提示：拖把手，拉过头试试；也能直接改数字
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>滑块</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.f-rg2 { width: min(84%, 260px); display: grid; gap: 12px; }
.f-rg2 label { font-size: 13px; color: var(--muted); }
.f-dual { position: relative; height: 24px; }
.f-dual .tr { position: absolute; left: 0; right: 0; top: 8px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--line) var(--a), var(--accent) var(--a), var(--accent) var(--b), var(--line) var(--b)); }
.f-dual .hd { position: absolute; left: -12px; top: 0; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 2px 6px var(--shadow); cursor: grab; touch-action: none; transition: scale .15s; }
.f-dual .hd.held { scale: 1.2; cursor: grabbing; }
.f-nums { display: grid; grid-template-columns: 1fr auto 1fr; gap: 7px; align-items: center; color: var(--muted); }
.f-nums input { width: 100%; min-width: 0; padding: 6px 9px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font: 14px var(--mono); }
</style></head>
<body><article class="sp" data-name="滑块" data-en="Slider" data-demo="range" data-hint="拖把手，拉过头试试；也能直接改数字" data-params="两端橡皮筋 · 弹簧弹回 · 范围内松手即停" data-use="拖两个把手定一个大致范围，比如价格。要准确数字就旁边再配输入框。" data-prompt="做一个价格区间滑块（Slider）：两个把手，中间段橙色，按住把手放大 1.2 倍；下方两个数字输入框和把手双向同步，方便输入精确数值。把手拉过两头或顶到另一个把手时用橡皮筋阻力（系数 0.55），松手用弹簧动画（刚度 300、阻尼比 1）带着松手速度弹回边界；在范围内松手就停在原地，不要惯性滑走。把手支持方向键。"><div class="stage"><div class="f-rg2"><label for="f-lon">价格区间（元）</label><div class="f-dual" style="--a:20%;--b:60%"><div class="tr"></div><span class="hd" id="f-lo" role="slider" tabindex="0" aria-label="最低价" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="200"></span><span class="hd" id="f-hi" role="slider" tabindex="0" aria-label="最高价" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="600"></span></div><div class="f-nums"><input id="f-lon" type="number" min="0" max="1000" value="200" aria-label="最低价数字"><span>至</span><input id="f-hin" type="number" min="0" max="1000" value="600" aria-label="最高价数字"></div></div></div></article>
<script>window.demo = {};
const spring = {
  // 跟手弹簧：拖拽松手类效果共用的三个小工具，无依赖，整段带走即可。
  // 用法：按下时 t = spring.tracker()，移动时 t.add(位置)，松手时 v = t.speed()，再 spring.to(当前位置, 终点, v, 画)。
  //
  // spring.to(from, to, v, draw, opt, done)：用弹簧把数值从 from 带到 to。
  //   没有写死的时长：每帧按「刚度 × 距离 − 阻尼 × 速度」算加速度，位置和速度都够小时自己停。
  //   v          起始速度，单位「每秒多少」，一般填松手速度，这样轻划和猛甩出来的动作不一样；填 0 就是从静止出发
  //   draw(x, v) 每帧调用一次，拿 x 去改样式
  //   opt.stiffness 刚度，默认 300。调大：拉得更狠，更快到、更干脆；调小：慢悠悠、发软
  //   opt.damping   阻尼比，默认 1。等于 1：最快停稳、不来回晃（猛甩时可能冲过终点一次再回来）；
  //                 小于 1：冲过头再晃回来，越小晃得越多，0.5 大约晃两下，适合俏皮的地方；大于 1：像在糖浆里慢慢挪
  //   opt.mass      质量，默认 1。调大：更沉，惯性更大，同样一甩冲得更远、停得更慢；调小：更轻、更灵
  //   opt.rest      停下的门槛，默认 0.1（适合 px）。scale 这类很小的数要调小，比如 0.001
  //   返回一个函数，调用它可以中途停下（手指再次按住时用）。
  //   开了系统的「减少动态效果」（prefers-reduced-motion）时直接跳到终点。
  to(from, to, v, draw, opt = {}, done) {
    const k = opt.stiffness ?? 300, m = opt.mass ?? 1, rest = opt.rest ?? .1;
    const c = 2 * (opt.damping ?? 1) * Math.sqrt(k * m);
    let x = from, raf = 0, stopped = false, last = performance.now();
    const finish = () => { draw(to, 0); if (done) done(); };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return () => {}; }
    const step = (now) => {
      // Fixed 4 ms sub-steps keep stiff springs stable even when a frame arrives late.
      for (let dt = Math.min(.064, (now - last) / 1000); dt > 0; dt -= .004) {
        const h = Math.min(dt, .004);
        v += (-k * (x - to) - c * v) / m * h;
        x += v * h;
      }
      last = now;
      if (Math.abs(x - to) < rest && Math.abs(v) < rest * 10) { finish(); return; }
      draw(x, v);
      if (!stopped) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => { stopped = true; cancelAnimationFrame(raf); };
  },
  // spring.rubber(x, min, max, size, c)：橡皮筋。x 在 min 到 max 之间原样返回；拉出边界后越拉越拉不动。
  //   size  元素在拖动方向上的尺寸（px），拉出去的距离永远到不了它
  //   c     阻力系数，默认 0.55（iOS 的取值）。调小：边界更硬，几乎拉不动；调大（最多 1）：更松
  rubber(x, min, max, size, c = .55) {
    const band = (d) => (1 - 1 / (d * c / size + 1)) * size;
    return x < min ? min - band(min - x) : x > max ? max + band(x - max) : x;
  },
  // spring.tracker()：估算松手速度。add(x) 记下每次指针位置，speed() 用最近 100ms 的位移算出每秒多少 px。
  //   松手前手指停住超过 80ms，速度算 0，这样「拖过去停一下再松」不会被当成甩。
  tracker() {
    let pts = [];
    return {
      add(x) {
        const t = performance.now();
        pts.push([t, x]);
        while (pts.length > 2 && t - pts[0][0] > 100) pts.shift();
      },
      speed() {
        const a = pts[0], b = pts[pts.length - 1];
        pts = [];
        if (!a || b[0] - a[0] < 1 || performance.now() - b[0] > 80) return 0;
        return (b[1] - a[1]) / (b[0] - a[0]) * 1000;
      },
    };
  },
};
demo.range = (stage, U) => {
  const dual = stage.querySelector('.f-dual');
  const hds = { lo: stage.querySelector('#f-lo'), hi: stage.querySelector('#f-hi') };
  const nums = { lo: stage.querySelector('#f-lon'), hi: stage.querySelector('#f-hin') };
  const MAX = 1000, GAP = 50, STEP = 10;
  const val = { lo: 200, hi: 600 };
  // raw: where the finger or the spring puts each handle, in px. It may run past the handle's limits; val never does.
  const raw = { lo: 0, hi: 0 };
  const stops = { lo: () => {}, hi: () => {} };
  const W = () => dual.clientWidth;
  const toPx = (v) => v / MAX * W();
  // Keep the two handles from crossing: lo runs from 0 to hi - GAP, hi from lo + GAP to MAX.
  const limits = (k) => (k === 'lo' ? [0, val.hi - GAP] : [val.lo + GAP, MAX]);
  const draw = (k) => {
    const [a, b] = limits(k);
    const p = spring.rubber(raw[k], toPx(a), toPx(b), 40);
    hds[k].style.transform = 'translateX(' + p.toFixed(1) + 'px)';
    dual.style.setProperty(k === 'lo' ? '--a' : '--b', (p / W() * 100).toFixed(2) + '%');
  };
  const setVal = (k, v) => {
    const [a, b] = limits(k);
    val[k] = Math.max(a, Math.min(b, Math.round(v / STEP) * STEP));
    nums[k].value = val[k];
    hds[k].setAttribute('aria-valuenow', val[k]);
  };
  const place = (k, v) => { stops[k](); setVal(k, v); raw[k] = toPx(val[k]); draw(k); };
  Object.keys(hds).forEach((k) => {
    const hd = hds[k], other = hds[k === 'lo' ? 'hi' : 'lo'];
    let from = null, track = null;
    hd.addEventListener('pointerdown', (e) => {
      stops[k]();
      from = e.clientX - raw[k];
      track = spring.tracker();
      track.add(raw[k]);
      hd.setPointerCapture(e.pointerId);
      hd.classList.add('held');
      hd.style.zIndex = 2; other.style.zIndex = 1;
    });
    hd.addEventListener('pointermove', (e) => {
      if (from === null) return;
      raw[k] = e.clientX - from;
      setVal(k, raw[k] / W() * MAX);
      draw(k);
      track.add(raw[k]);
    });
    const up = () => {
      if (from === null) return;
      from = null;
      hd.classList.remove('held');
      // A slider is a precise control: inside its range the value stays where the finger let go, with no fling.
      // Only a handle pulled past its limit springs back, carrying the release speed.
      const [a, b] = limits(k);
      const over = raw[k] < toPx(a) || raw[k] > toPx(b);
      stops[k] = spring.to(raw[k], toPx(val[k]), over ? track.speed() : 0, (x) => { raw[k] = x; draw(k); });
    };
    hd.addEventListener('pointerup', up);
    hd.addEventListener('pointercancel', up);
    hd.addEventListener('keydown', (e) => {
      const dir = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key];
      if (!dir) return;
      e.preventDefault();
      place(k, val[k] + dir * STEP);
    });
    nums[k].addEventListener('change', () => place(k, +nums[k].value));
  });
  place('lo', val.lo); place('hi', val.hi);
  addEventListener('resize', () => { place('lo', val.lo); place('hi', val.hi); });
  stage.addEventListener('inview', () => {
    U.tween(1200, (p) => { place('lo', 200 + Math.sin(p * Math.PI) * 180); place('hi', 600 + Math.sin(p * Math.PI) * 220); });
  });
};
</script>
<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFrozen = (stage) => reduced || stage.closest('.sp').classList.contains('off');
  const U = {
    loop(stage, fn, ms) { setInterval(() => { if (!isFrozen(stage)) fn(); }, ms); },
    auto(stage, fn, ms) { U.loop(stage, () => { if (!stage.dataset.touched) fn(); }, ms); },
    frame(stage, fn) { const step = (t) => { if (!isFrozen(stage)) fn(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
    tween(ms, fn, done) {
      const start = performance.now();
      const step = (now) => { const p = Math.min(1, (now - start) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); };
      requestAnimationFrame(step);
    },
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
  };
  const card = document.querySelector('.sp');
  const stage = card.querySelector('.stage');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle],[data-open],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-toggle')) stage.classList.toggle('on');
    else if (t.hasAttribute('data-open')) stage.classList.add('on');
    else stage.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stage.classList.remove('on'); });
  stage.addEventListener('pointerdown', () => { stage.dataset.touched = '1'; }, true);
  stage.addEventListener('focusin', () => { stage.dataset.touched = '1'; }, true);
  const fn = window.demo[card.dataset.demo];
  if (card.dataset.demo && !fn) console.error('missing demo: ' + card.dataset.demo);
  if (fn) fn(stage, U);
  let seen = false;
  new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      card.classList.toggle('off', !en.isIntersecting);
      if (!en.isIntersecting || seen) return;
      seen = true;
      setTimeout(() => {
        if (stage.dataset.touched) return;
        if (card.hasAttribute('data-auto')) stage.classList.add('on');
        stage.dispatchEvent(new Event('inview'));
      }, 450);
    });
  }, { threshold: 0.15 }).observe(card);
})();
</script>
</body></html>
