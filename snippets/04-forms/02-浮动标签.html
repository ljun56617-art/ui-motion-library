<!doctype html>
<!--
名称：浮动标签（Floating Label）
编号：04-forms/02
什么时候用：字段名先待在框里，一点进去就缩到框的上沿，填的时候也不会丢。
一句话提示词：做一个浮动标签（Floating Label）输入框：标签默认在框内，聚焦或有内容时缩小到 74% 并移到左上方变橙色，180ms，始终保持可见。
操作提示：点空的那一格
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>浮动标签</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.f-col { width: min(84%, 270px); display: grid; gap: 14px; }
.f-field { position: relative; }
.f-input { width: 100%; padding: 12px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); outline: none; transition: border-color .2s, box-shadow .2s; }
.f-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.f-float .f-input { padding-top: 19px; padding-bottom: 6px; }
.f-float label { position: absolute; left: 13px; top: 13px; color: var(--muted); pointer-events: none; transform-origin: 0 0; transition: transform .18s, color .18s; }
.f-float .f-input:focus + label, .f-float .f-input:not(:placeholder-shown) + label { transform: translateY(-8px) scale(.74); color: var(--accent); }
</style></head>
<body><article class="sp" data-name="浮动标签" data-en="Floating Label" data-hint="点空的那一格" data-use="字段名先待在框里，一点进去就缩到框的上沿，填的时候也不会丢。" data-prompt="做一个浮动标签（Floating Label）输入框：标签默认在框内，聚焦或有内容时缩小到 74% 并移到左上方变橙色，180ms，始终保持可见。"><div class="stage"><div class="f-col"><div class="f-field f-float"><input class="f-input" id="f-name" placeholder=" " value="林小满"><label for="f-name">姓名</label></div><div class="f-field f-float"><input class="f-input" id="f-city" placeholder=" "><label for="f-city">所在城市</label></div></div></div></article>
</body></html>
