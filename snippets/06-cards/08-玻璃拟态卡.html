<!doctype html>
<!--
名称：玻璃拟态卡（Glassmorphism）
编号：06-cards/08
什么时候用：半透明磨砂，背后的色块透出来。背景要有色彩变化才看得出效果。
一句话提示词：做一个玻璃拟态卡：半透明背景加 backdrop-filter 模糊 14px，细白边框，背后放几个缓慢漂浮的彩色圆形。
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>玻璃拟态卡</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.c-glass-bg { position: absolute; inset: 0; background: linear-gradient(135deg, var(--art3), var(--art1)); }
.c-glass-bg i { position: absolute; border-radius: 50%; animation: c-orb 7s ease-in-out infinite alternate; }
.c-glass-bg i:nth-child(1) { width: 130px; height: 130px; left: 8%; top: 12%; background: var(--art2); }
.c-glass-bg i:nth-child(2) { width: 96px; height: 96px; right: 10%; bottom: 8%; background: var(--on-art); opacity: .9; animation-delay: -2s; animation-duration: 6s; }
.c-glass-bg i:nth-child(3) { width: 66px; height: 66px; right: 30%; top: 8%; background: var(--accent-deep); animation-duration: 9s; }
.c-glass { position: relative; width: min(74%, 230px); padding: 17px; border-radius: 16px; color: var(--ink); background: color-mix(in srgb, var(--surface) 45%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); border: 1px solid color-mix(in srgb, var(--surface) 60%, transparent); box-shadow: 0 10px 26px var(--shadow); }
.c-glass h4 { margin: 0 0 3px; font-size: 17px; }
.c-glass p { margin: 0; font-size: 13.5px; }
@keyframes c-orb { to { transform: translate(34px, 24px) scale(1.15); } }
</style></head>
<body><article class="sp" data-name="玻璃拟态卡" data-en="Glassmorphism" data-use="半透明磨砂，背后的色块透出来。背景要有色彩变化才看得出效果。" data-prompt="做一个玻璃拟态卡：半透明背景加 backdrop-filter 模糊 14px，细白边框，背后放几个缓慢漂浮的彩色圆形。"><div class="stage"><div class="c-glass-bg"><i></i><i></i><i></i></div><div class="c-glass"><h4>今日学习</h4><p>已完成 2 节，还差 1 节就达成目标。</p></div></div></article>
</body></html>
