<!doctype html>
<!--
名称：便当格（Bento Grid）
编号：06-cards/11
什么时候用：大小不一的卡片拼成一块，把重点放大。近年官网和个人主页很流行。
一句话提示词：做一个便当格布局：3 列 3 行网格，主卡占 2×2，其余大小不一，间距 7px，悬停时单个格子放大 4%。
操作提示：移到格子上
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>便当格</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.c-bento { width: min(92%, 310px); height: 250px; margin-bottom: 18px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 7px; }
.c-bento > div { border-radius: 12px; padding: 9px 10px; background: var(--surface); box-shadow: 0 2px 7px var(--shadow); font-size: 12.5px; display: grid; align-content: end; transition: transform .25s cubic-bezier(.2, 1.3, .4, 1); min-width: 0; }
.c-bento > div:hover { transform: scale(1.04); }
.c-bento b { font-size: 21px; font-family: var(--mono); line-height: 1.2; }
.c-b1 { grid-column: span 2; grid-row: span 2; background: linear-gradient(150deg, var(--art3), var(--art1) 60%, var(--art2)) !important; color: var(--on-art); font-size: 15px !important; font-weight: 700; }
.c-b4 { grid-column: span 2; }
</style></head>
<body><article class="sp" data-name="便当格" data-en="Bento Grid" data-hint="移到格子上" data-use="大小不一的卡片拼成一块，把重点放大。近年官网和个人主页很流行。" data-prompt="做一个便当格布局：3 列 3 行网格，主卡占 2×2，其余大小不一，间距 7px，悬停时单个格子放大 4%。"><div class="stage"><div class="c-bento"><div class="c-b1">本周学习概览</div><div><b>7</b>连续天数</div><div><b>3</b>待交作业</div><div class="c-b4"><b>82%</b>课程进度</div><div><b>A</b>上次成绩</div></div></div></article>
</body></html>
