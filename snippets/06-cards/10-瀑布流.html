<!doctype html>
<!--
名称：瀑布流（Masonry）
编号：06-cards/10
什么时候用：列宽一致、高矮不齐，图片比例不一样时也能排得紧密。
一句话提示词：做一个瀑布流（Masonry）：三列等宽、高度不一的卡片，上下紧密排列没有空洞，进场时依次上浮淡入，每张延迟 60ms。
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>瀑布流</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.k-mas { position: absolute; inset: 0; padding: 10px 12px; columns: 3; column-gap: 8px; overflow: hidden; }
.k-mas div { break-inside: avoid; margin-bottom: 8px; border-radius: 9px; display: grid; align-content: end; padding: 7px; font-size: 12px; font-weight: 600; color: var(--on-art); transition: transform .2s; animation: k-rise .4s calc(var(--i) * 60ms) cubic-bezier(.2, .9, .3, 1) backwards; }
.k-mas div:hover { transform: scale(1.04); }
.k-mas div:nth-child(3n+1) { background: linear-gradient(160deg, var(--art3), var(--art1)); }
.k-mas div:nth-child(3n+2) { background: linear-gradient(160deg, var(--art1), var(--art2)); }
.k-mas div:nth-child(3n) { background: linear-gradient(160deg, var(--art2), var(--accent-deep)); }
@keyframes k-rise { from { opacity: 0; transform: translateY(14px); } }
</style></head>
<body><article class="sp" data-name="瀑布流" data-en="Masonry" data-use="列宽一致、高矮不齐，图片比例不一样时也能排得紧密。" data-prompt="做一个瀑布流（Masonry）：三列等宽、高度不一的卡片，上下紧密排列没有空洞，进场时依次上浮淡入，每张延迟 60ms。"><div class="stage"><div class="k-mas"><div style="height:96px;--i:0">作品 1</div><div style="height:62px;--i:1">作品 2</div><div style="height:112px;--i:2">作品 3</div><div style="height:76px;--i:3">作品 4</div><div style="height:120px;--i:4">作品 5</div><div style="height:58px;--i:5">作品 6</div><div style="height:84px;--i:6">作品 7</div><div style="height:94px;--i:7">作品 8</div><div style="height:78px;--i:8">作品 9</div></div></div></article>
</body></html>
