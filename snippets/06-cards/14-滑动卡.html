<!doctype html>
<!--
名称：滑动卡（Swipe Card）
编号：06-cards/14
什么时候用：一次只决定一张，左滑不要、右滑想要。探探模式。
一句话提示词：做一个左右滑动卡片：卡片跟手拖动并随距离旋转，出现「想学」或「跳过」印章；超过 90px 飞出，否则回弹。
操作提示：左右拖动卡片
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>滑动卡</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.c { width: min(84%, 260px); background: var(--surface); border-radius: 14px; box-shadow: 0 4px 14px var(--shadow); overflow: hidden; }
.c h4 { margin: 0 0 3px; font-size: 16px; line-height: 1.35; }
.c p { margin: 0; font-size: 13px; color: var(--muted); }
.c-swipe-box { position: relative; width: min(66%, 200px); height: 240px; }
.c-sw { position: absolute; inset: 0; border-radius: 14px; padding: 13px; display: grid; align-content: end; color: var(--on-art); box-shadow: 0 7px 18px var(--shadow); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.c-sw:active { cursor: grabbing; }
.c-sw b { font-size: 17px; }
.c-sw.back { transition: transform .35s cubic-bezier(.2, 1.2, .4, 1); }
.c-sw.fly { transition: transform .35s ease-in, opacity .35s; opacity: 0; }
.c-sw[data-c="0"] { background: linear-gradient(150deg, var(--art3), var(--art1)); }
.c-sw[data-c="1"] { background: linear-gradient(150deg, var(--art1), var(--art2)); }
.c-sw[data-c="2"] { background: linear-gradient(150deg, var(--accent), var(--accent-deep)); }
.c-stamp { position: absolute; top: 14px; padding: 0 9px; border: 2.5px solid currentColor; border-radius: 7px; font-size: 16px; font-weight: 800; background: var(--surface); opacity: 0; }
.c-stamp.y { left: 11px; color: var(--ok); transform: rotate(-12deg); }
.c-stamp.n { right: 11px; color: var(--err); transform: rotate(12deg); }
</style></head>
<body><article class="sp" data-name="滑动卡" data-en="Swipe Card" data-demo="swipe" data-hint="左右拖动卡片" data-use="一次只决定一张，左滑不要、右滑想要。探探模式。" data-prompt="做一个左右滑动卡片：卡片跟手拖动并随距离旋转，出现「想学」或「跳过」印章；超过 90px 飞出，否则回弹。"><div class="stage"><div class="c-swipe-box"></div></div></article>
<script>window.demo = {};
demo.swipe = (stage, U) => {
  const box = stage.querySelector('.c-swipe-box');
  const THRESHOLD = 90;
  const SWIPES = ['提示词入门', '做一个网页', '自动化报表', '数据看板'];
  let n = 0;
  const make = () => {
    const c = document.createElement('div');
    c.className = 'c-sw';
    c.dataset.c = n % 3;
    c.innerHTML = '<span class="c-stamp y">想学</span><span class="c-stamp n">跳过</span>';
    const title = document.createElement('b');
    title.textContent = SWIPES[n++ % SWIPES.length];
    c.appendChild(title);
    wire(c);
    box.prepend(c);
    return c;
  };
  const place = (c, x) => {
    c.style.transform = 'translateX(' + x + 'px) rotate(' + x * .07 + 'deg)';
    c.querySelector('.y').style.opacity = Math.max(0, Math.min(1, x / THRESHOLD));
    c.querySelector('.n').style.opacity = Math.max(0, Math.min(1, -x / THRESHOLD));
  };
  const fly = (c, dir) => {
    c.classList.add('fly');
    place(c, dir * 320);
    setTimeout(() => { c.remove(); make(); }, 360);
  };
  function wire(c) {
    let from = null, x = 0;
    c.addEventListener('pointerdown', (e) => { from = e.clientX; c.setPointerCapture(e.pointerId); c.classList.remove('back'); });
    c.addEventListener('pointermove', (e) => { if (from !== null) { x = e.clientX - from; place(c, x); } });
    const up = () => {
      if (from === null) return;
      from = null;
      if (Math.abs(x) > THRESHOLD) fly(c, Math.sign(x));
      else { c.classList.add('back'); place(c, 0); }
      x = 0;
    };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
  }
  make(); make();
  let side = 1;
  U.auto(stage, () => {
    const top = box.lastElementChild;
    if (!top || top.classList.contains('fly')) return;
    const dir = side; side = -side;
    U.tween(600, (p) => place(top, dir * 110 * U.easeOut(p)), () => fly(top, dir));
  }, 3200);
};
</script>
<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFrozen = (stage) => reduced || stage.closest('.sp').classList.contains('off');
  const U = {
    loop(stage, fn, ms) { setInterval(() => { if (!isFrozen(stage)) fn(); }, ms); },
    auto(stage, fn, ms) { U.loop(stage, () => { if (!stage.dataset.touched) fn(); }, ms); },
    frame(stage, fn) { const step = (t) => { if (!isFrozen(stage)) fn(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
    tween(ms, fn, done) {
      const start = performance.now();
      const step = (now) => { const p = Math.min(1, (now - start) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); };
      requestAnimationFrame(step);
    },
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
  };
  const card = document.querySelector('.sp');
  const stage = card.querySelector('.stage');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle],[data-open],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-toggle')) stage.classList.toggle('on');
    else if (t.hasAttribute('data-open')) stage.classList.add('on');
    else stage.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stage.classList.remove('on'); });
  stage.addEventListener('pointerdown', () => { stage.dataset.touched = '1'; }, true);
  stage.addEventListener('focusin', () => { stage.dataset.touched = '1'; }, true);
  const fn = window.demo[card.dataset.demo];
  if (card.dataset.demo && !fn) console.error('missing demo: ' + card.dataset.demo);
  if (fn) fn(stage, U);
  let seen = false;
  new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      card.classList.toggle('off', !en.isIntersecting);
      if (!en.isIntersecting || seen) return;
      seen = true;
      setTimeout(() => {
        if (stage.dataset.touched) return;
        if (card.hasAttribute('data-auto')) stage.classList.add('on');
        stage.dispatchEvent(new Event('inview'));
      }, 450);
    });
  }, { threshold: 0.15 }).observe(card);
})();
</script>
</body></html>
