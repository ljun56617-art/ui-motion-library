<!doctype html>
<!--
名称：滑动卡（Swipe Card）
编号：06-cards/14
什么时候用：一次只决定一张，左滑不要、右滑想要。探探模式。拖得不远但甩得快，也算滑走。
关键参数：弹簧回中 · 阻尼比 0.7 · 松手速度决定飞不飞
一句话提示词：做一个左右滑动卡片：卡片跟手拖动并随距离旋转，出现「想学」或「跳过」印章；松手时用最近 100ms 的指针位置估算速度，「松手位置 + 速度 × 0.2 秒」超过 90px 就带着这个速度飞出，否则用弹簧动画（刚度 300、阻尼比 0.7）带着松手速度回到中间，不写死时长。
操作提示：左右拖动卡片，轻划和猛甩各试一次
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>滑动卡</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.c { width: min(84%, 260px); background: var(--surface); border-radius: 14px; box-shadow: 0 4px 14px var(--shadow); overflow: hidden; }
.c h4 { margin: 0 0 3px; font-size: 16px; line-height: 1.35; }
.c p { margin: 0; font-size: 13px; color: var(--muted); }
.c-swipe-box { position: relative; width: min(66%, 200px); height: 240px; }
.c-sw { position: absolute; inset: 0; border-radius: 14px; padding: 13px; display: grid; align-content: end; color: var(--on-art); box-shadow: 0 7px 18px var(--shadow); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.c-sw:active { cursor: grabbing; }
.c-sw b { font-size: 17px; }
.c-sw[data-c="0"] { background: linear-gradient(150deg, var(--art3), var(--art1)); }
.c-sw[data-c="1"] { background: linear-gradient(150deg, var(--art1), var(--art2)); }
.c-sw[data-c="2"] { background: linear-gradient(150deg, var(--accent), var(--accent-deep)); }
.c-stamp { position: absolute; top: 14px; padding: 0 9px; border: 2.5px solid currentColor; border-radius: 7px; font-size: 16px; font-weight: 800; background: var(--surface); opacity: 0; }
.c-stamp.y { left: 11px; color: var(--ok); transform: rotate(-12deg); }
.c-stamp.n { right: 11px; color: var(--err); transform: rotate(12deg); }
</style></head>
<body><article class="sp" data-name="滑动卡" data-en="Swipe Card" data-demo="swipe" data-hint="左右拖动卡片，轻划和猛甩各试一次" data-params="弹簧回中 · 阻尼比 0.7 · 松手速度决定飞不飞" data-use="一次只决定一张，左滑不要、右滑想要。探探模式。拖得不远但甩得快，也算滑走。" data-prompt="做一个左右滑动卡片：卡片跟手拖动并随距离旋转，出现「想学」或「跳过」印章；松手时用最近 100ms 的指针位置估算速度，「松手位置 + 速度 × 0.2 秒」超过 90px 就带着这个速度飞出，否则用弹簧动画（刚度 300、阻尼比 0.7）带着松手速度回到中间，不写死时长。"><div class="stage"><div class="c-swipe-box"></div></div></article>
<script>window.demo = {};
const spring = {
  // 跟手弹簧：拖拽松手类效果共用的三个小工具，无依赖，整段带走即可。
  // 用法：按下时 t = spring.tracker()，移动时 t.add(位置)，松手时 v = t.speed()，再 spring.to(当前位置, 终点, v, 画)。
  //
  // spring.to(from, to, v, draw, opt, done)：用弹簧把数值从 from 带到 to。
  //   没有写死的时长：每帧按「刚度 × 距离 − 阻尼 × 速度」算加速度，位置和速度都够小时自己停。
  //   v          起始速度，单位「每秒多少」，一般填松手速度，这样轻划和猛甩出来的动作不一样；填 0 就是从静止出发
  //   draw(x, v) 每帧调用一次，拿 x 去改样式
  //   opt.stiffness 刚度，默认 300。调大：拉得更狠，更快到、更干脆；调小：慢悠悠、发软
  //   opt.damping   阻尼比，默认 1。等于 1：最快停稳、不来回晃（猛甩时可能冲过终点一次再回来）；
  //                 小于 1：冲过头再晃回来，越小晃得越多，0.5 大约晃两下，适合俏皮的地方；大于 1：像在糖浆里慢慢挪
  //   opt.mass      质量，默认 1。调大：更沉，惯性更大，同样一甩冲得更远、停得更慢；调小：更轻、更灵
  //   opt.rest      停下的门槛，默认 0.1（适合 px）。scale 这类很小的数要调小，比如 0.001
  //   返回一个函数，调用它可以中途停下（手指再次按住时用）。
  //   开了系统的「减少动态效果」（prefers-reduced-motion）时直接跳到终点。
  to(from, to, v, draw, opt = {}, done) {
    const k = opt.stiffness ?? 300, m = opt.mass ?? 1, rest = opt.rest ?? .1;
    const c = 2 * (opt.damping ?? 1) * Math.sqrt(k * m);
    let x = from, raf = 0, stopped = false, last = performance.now();
    const finish = () => { draw(to, 0); if (done) done(); };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return () => {}; }
    const step = (now) => {
      // Fixed 4 ms sub-steps keep stiff springs stable even when a frame arrives late.
      for (let dt = Math.min(.064, (now - last) / 1000); dt > 0; dt -= .004) {
        const h = Math.min(dt, .004);
        v += (-k * (x - to) - c * v) / m * h;
        x += v * h;
      }
      last = now;
      if (Math.abs(x - to) < rest && Math.abs(v) < rest * 10) { finish(); return; }
      draw(x, v);
      if (!stopped) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => { stopped = true; cancelAnimationFrame(raf); };
  },
  // spring.rubber(x, min, max, size, c)：橡皮筋。x 在 min 到 max 之间原样返回；拉出边界后越拉越拉不动。
  //   size  元素在拖动方向上的尺寸（px），拉出去的距离永远到不了它
  //   c     阻力系数，默认 0.55（iOS 的取值）。调小：边界更硬，几乎拉不动；调大（最多 1）：更松
  rubber(x, min, max, size, c = .55) {
    const band = (d) => (1 - 1 / (d * c / size + 1)) * size;
    return x < min ? min - band(min - x) : x > max ? max + band(x - max) : x;
  },
  // spring.tracker()：估算松手速度。add(x) 记下每次指针位置，speed() 用最近 100ms 的位移算出每秒多少 px。
  //   松手前手指停住超过 80ms，速度算 0，这样「拖过去停一下再松」不会被当成甩。
  tracker() {
    let pts = [];
    return {
      add(x) {
        const t = performance.now();
        pts.push([t, x]);
        while (pts.length > 2 && t - pts[0][0] > 100) pts.shift();
      },
      speed() {
        const a = pts[0], b = pts[pts.length - 1];
        pts = [];
        if (!a || b[0] - a[0] < 1 || performance.now() - b[0] > 80) return 0;
        return (b[1] - a[1]) / (b[0] - a[0]) * 1000;
      },
    };
  },
};


// Plays the hover state on a timer until the viewer takes over.
demo.swipe = (stage, U) => {
  const box = stage.querySelector('.c-swipe-box');
  const THRESHOLD = 90;
  const SWIPES = ['提示词入门', '做一个网页', '自动化报表', '数据看板'];
  let n = 0;
  const make = () => {
    const c = document.createElement('div');
    c.className = 'c-sw';
    c.dataset.c = n % 3;
    c.innerHTML = '<span class="c-stamp y">想学</span><span class="c-stamp n">跳过</span>';
    const title = document.createElement('b');
    title.textContent = SWIPES[n++ % SWIPES.length];
    c.appendChild(title);
    wire(c);
    box.prepend(c);
    return c;
  };
  const place = (c, x) => {
    c.style.transform = 'translateX(' + x + 'px) rotate(' + x * .07 + 'deg)';
    c.querySelector('.y').style.opacity = Math.max(0, Math.min(1, x / THRESHOLD));
    c.querySelector('.n').style.opacity = Math.max(0, Math.min(1, -x / THRESHOLD));
  };
  // Thrown out: the card keeps the release speed (at least 800 px/s) and leaves once it is off the stage.
  const fly = (c, dir, v) => {
    c.gone = true;
    let stop = null, left = false;
    const leave = () => { if (left) return; left = true; if (stop) stop(); c.remove(); make(); };
    stop = spring.to(c.x, dir * 600, dir * Math.max(800, Math.abs(v)), (x) => {
      c.x = x;
      place(c, x);
      c.style.opacity = Math.max(0, 1 - (Math.abs(x) - THRESHOLD) / 230);
      if (Math.abs(x) > 320) leave();
    }, { stiffness: 200 }, leave);
  };
  function wire(c) {
    let from = null, track = null, stop = () => {};
    c.x = 0;
    c.addEventListener('pointerdown', (e) => {
      if (c.gone) return;
      stop();
      from = e.clientX - c.x;
      track = spring.tracker();
      track.add(c.x);
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', (e) => { if (from === null) return; c.x = e.clientX - from; place(c, c.x); track.add(c.x); });
    const up = () => {
      if (from === null) return;
      from = null;
      const v = track.speed();
      // Judge by where the throw is heading in about 0.2 s, not only where the finger let go: a quick flick counts.
      const aim = c.x + v * .2;
      if (Math.abs(aim) > THRESHOLD) fly(c, Math.sign(aim), v);
      // Back to the middle with the release speed; damping .7 lets it settle with one small sway, like a real card.
      else stop = spring.to(c.x, 0, v, (x) => { c.x = x; place(c, x); }, { damping: .7 });
    };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
  }
  make(); make();
  let side = 1;
  U.auto(stage, () => {
    const top = box.lastElementChild;
    if (!top || top.gone) return;
    const dir = side; side = -side;
    U.tween(600, (p) => { top.x = dir * 110 * U.easeOut(p); place(top, top.x); }, () => fly(top, dir, dir * 900));
  }, 3200);
};
</script>
<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFrozen = (stage) => reduced || stage.closest('.sp').classList.contains('off');
  const U = {
    loop(stage, fn, ms) { setInterval(() => { if (!isFrozen(stage)) fn(); }, ms); },
    auto(stage, fn, ms) { U.loop(stage, () => { if (!stage.dataset.touched) fn(); }, ms); },
    frame(stage, fn) { const step = (t) => { if (!isFrozen(stage)) fn(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
    tween(ms, fn, done) {
      const start = performance.now();
      const step = (now) => { const p = Math.min(1, (now - start) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); };
      requestAnimationFrame(step);
    },
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
  };
  const card = document.querySelector('.sp');
  const stage = card.querySelector('.stage');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle],[data-open],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-toggle')) stage.classList.toggle('on');
    else if (t.hasAttribute('data-open')) stage.classList.add('on');
    else stage.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stage.classList.remove('on'); });
  stage.addEventListener('pointerdown', () => { stage.dataset.touched = '1'; }, true);
  stage.addEventListener('focusin', () => { stage.dataset.touched = '1'; }, true);
  const fn = window.demo[card.dataset.demo];
  if (card.dataset.demo && !fn) console.error('missing demo: ' + card.dataset.demo);
  if (fn) fn(stage, U);
  let seen = false;
  new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      card.classList.toggle('off', !en.isIntersecting);
      if (!en.isIntersecting || seen) return;
      seen = true;
      setTimeout(() => {
        if (stage.dataset.touched) return;
        if (card.hasAttribute('data-auto')) stage.classList.add('on');
        stage.dispatchEvent(new Event('inview'));
      }, 450);
    });
  }, { threshold: 0.15 }).observe(card);
})();
</script>
</body></html>
