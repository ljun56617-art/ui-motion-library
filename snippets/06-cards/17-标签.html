<!doctype html>
<!--
名称：标签（Tag）
编号：06-cards/17
什么时候用：小色块标出状态。状态多时别每种都配新色，五种上下最好认。
一句话提示词：做一组状态标签（Tag）：圆角小方块，浅色底配同色字，已完成绿、进行中橙、待处理金、已取消红、草稿灰，总共不超过 5 种颜色。
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>标签</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.k-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(88%, 280px); }
.k-tags span { padding: 2px 11px; border-radius: 7px; font-size: 13.5px; font-weight: 600; animation: k-tag 4s calc(var(--i) * 110ms) cubic-bezier(.2, 1.4, .4, 1) infinite; }
.k-t-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.k-t-err { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }
.k-t-wait { background: color-mix(in srgb, var(--gold) 26%, transparent); color: var(--ink); }
.k-t-a { background: var(--soft); color: var(--accent); }
.k-t-m { background: var(--line); color: var(--ink); }
@keyframes k-tag { 0% { opacity: 0; transform: scale(.7); } 10%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style></head>
<body><article class="sp" data-name="标签" data-en="Tag" data-use="小色块标出状态。状态多时别每种都配新色，五种上下最好认。" data-prompt="做一组状态标签（Tag）：圆角小方块，浅色底配同色字，已完成绿、进行中橙、待处理金、已取消红、草稿灰，总共不超过 5 种颜色。"><div class="stage"><div class="k-tags"><span class="k-t-ok" style="--i:0">已完成</span><span class="k-t-a" style="--i:1">进行中</span><span class="k-t-wait" style="--i:2">待处理</span><span class="k-t-err" style="--i:3">已取消</span><span class="k-t-m" style="--i:4">草稿</span></div></div></article>
</body></html>
