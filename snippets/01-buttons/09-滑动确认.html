<!doctype html>
<!--
名称：滑动确认（Slide to Confirm）
编号：01-buttons/09
什么时候用：付款、解锁这类要用户明确同意的动作。手机上单手就能完成。只认拖到的位置，甩一下不算同意。
关键参数：拖过 85% 才算 · 弹簧阻尼比 1 · 两端橡皮筋
一句话提示词：做一个滑动确认条：拖动圆钮向右，提示文字有光扫过；圆钮拉过两端时用橡皮筋阻力（系数 0.55）；松手时圆钮位置过了 85% 判定成功并变绿，没到就回起点。两种结局都用弹簧动画（刚度 300、阻尼比 1），以最近 100ms 估出的松手速度为初速度，不写死时长；只看位置判定，甩得再快也不算确认。
操作提示：拖动圆钮到最右，拉过两头试试
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>滑动确认</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.b-slide { position: relative; width: min(84%, 270px); height: 54px; border-radius: 27px; background: var(--soft); overflow: hidden; user-select: none; -webkit-user-select: none; }
.b-slide .bar { position: absolute; inset: 0 auto 0 0; width: 54px; background: var(--accent); opacity: .35; border-radius: 27px; }
.b-slide .lab { position: absolute; inset: 0; display: grid; place-items: center; padding-left: 40px; font-size: 14px; font-weight: 500; background: linear-gradient(100deg, var(--muted) 40%, var(--accent) 50%, var(--muted) 60%) 0 0 / 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: b-shine 2.4s linear infinite; }
.b-slide .hd { position: absolute; left: 4px; top: 4px; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 20px; cursor: grab; touch-action: none; }
.b-slide .hd:active { cursor: grabbing; }
.b-slide.done .lab { animation: none; background: none; color: var(--ok); -webkit-text-fill-color: var(--ok); font-weight: 600; padding-left: 0; }
@keyframes b-shine { from { background-position: 100% 0; } to { background-position: -40% 0; } }
</style></head>
<body><article class="sp" data-name="滑动确认" data-en="Slide to Confirm" data-demo="slide" data-hint="拖动圆钮到最右，拉过两头试试" data-params="拖过 85% 才算 · 弹簧阻尼比 1 · 两端橡皮筋" data-use="付款、解锁这类要用户明确同意的动作。手机上单手就能完成。只认拖到的位置，甩一下不算同意。" data-prompt="做一个滑动确认条：拖动圆钮向右，提示文字有光扫过；圆钮拉过两端时用橡皮筋阻力（系数 0.55）；松手时圆钮位置过了 85% 判定成功并变绿，没到就回起点。两种结局都用弹簧动画（刚度 300、阻尼比 1），以最近 100ms 估出的松手速度为初速度，不写死时长；只看位置判定，甩得再快也不算确认。"><div class="stage"><div class="b-slide"><span class="bar"></span><span class="lab">向右滑动，确认付款</span><button class="hd" type="button" aria-label="拖动确认，也可以按回车">→</button></div></div></article>
<script>window.demo = {};
const spring = {
  // 跟手弹簧：拖拽松手类效果共用的三个小工具，无依赖，整段带走即可。
  // 用法：按下时 t = spring.tracker()，移动时 t.add(位置)，松手时 v = t.speed()，再 spring.to(当前位置, 终点, v, 画)。
  //
  // spring.to(from, to, v, draw, opt, done)：用弹簧把数值从 from 带到 to。
  //   没有写死的时长：每帧按「刚度 × 距离 − 阻尼 × 速度」算加速度，位置和速度都够小时自己停。
  //   v          起始速度，单位「每秒多少」，一般填松手速度，这样轻划和猛甩出来的动作不一样；填 0 就是从静止出发
  //   draw(x, v) 每帧调用一次，拿 x 去改样式
  //   opt.stiffness 刚度，默认 300。调大：拉得更狠，更快到、更干脆；调小：慢悠悠、发软
  //   opt.damping   阻尼比，默认 1。等于 1：最快停稳、不来回晃（猛甩时可能冲过终点一次再回来）；
  //                 小于 1：冲过头再晃回来，越小晃得越多，0.5 大约晃两下，适合俏皮的地方；大于 1：像在糖浆里慢慢挪
  //   opt.mass      质量，默认 1。调大：更沉，惯性更大，同样一甩冲得更远、停得更慢；调小：更轻、更灵
  //   opt.rest      停下的门槛，默认 0.1（适合 px）。scale 这类很小的数要调小，比如 0.001
  //   返回一个函数，调用它可以中途停下（手指再次按住时用）。
  //   开了系统的「减少动态效果」（prefers-reduced-motion）时直接跳到终点。
  to(from, to, v, draw, opt = {}, done) {
    const k = opt.stiffness ?? 300, m = opt.mass ?? 1, rest = opt.rest ?? .1;
    const c = 2 * (opt.damping ?? 1) * Math.sqrt(k * m);
    let x = from, raf = 0, stopped = false, last = performance.now();
    const finish = () => { draw(to, 0); if (done) done(); };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return () => {}; }
    const step = (now) => {
      // Fixed 4 ms sub-steps keep stiff springs stable even when a frame arrives late.
      for (let dt = Math.min(.064, (now - last) / 1000); dt > 0; dt -= .004) {
        const h = Math.min(dt, .004);
        v += (-k * (x - to) - c * v) / m * h;
        x += v * h;
      }
      last = now;
      if (Math.abs(x - to) < rest && Math.abs(v) < rest * 10) { finish(); return; }
      draw(x, v);
      if (!stopped) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => { stopped = true; cancelAnimationFrame(raf); };
  },
  // spring.rubber(x, min, max, size, c)：橡皮筋。x 在 min 到 max 之间原样返回；拉出边界后越拉越拉不动。
  //   size  元素在拖动方向上的尺寸（px），拉出去的距离永远到不了它
  //   c     阻力系数，默认 0.55（iOS 的取值）。调小：边界更硬，几乎拉不动；调大（最多 1）：更松
  rubber(x, min, max, size, c = .55) {
    const band = (d) => (1 - 1 / (d * c / size + 1)) * size;
    return x < min ? min - band(min - x) : x > max ? max + band(x - max) : x;
  },
  // spring.tracker()：估算松手速度。add(x) 记下每次指针位置，speed() 用最近 100ms 的位移算出每秒多少 px。
  //   松手前手指停住超过 80ms，速度算 0，这样「拖过去停一下再松」不会被当成甩。
  tracker() {
    let pts = [];
    return {
      add(x) {
        const t = performance.now();
        pts.push([t, x]);
        while (pts.length > 2 && t - pts[0][0] > 100) pts.shift();
      },
      speed() {
        const a = pts[0], b = pts[pts.length - 1];
        pts = [];
        if (!a || b[0] - a[0] < 1 || performance.now() - b[0] > 80) return 0;
        return (b[1] - a[1]) / (b[0] - a[0]) * 1000;
      },
    };
  },
};
demo.slide = (stage, U) => {
  const box = stage.querySelector('.b-slide');
  const hd = box.querySelector('.hd');
  const bar = box.querySelector('.bar');
  const lab = box.querySelector('.lab');
  const label = lab.textContent;
  const max = () => box.clientWidth - hd.offsetWidth - 8;
  let x = 0, from = null, track = null, stop = () => {};
  // x may run past either end (a drag or a fast release); the knob is drawn through a rubber band, so it stretches instead of hitting a wall.
  const set = (v) => {
    x = v;
    const s = spring.rubber(v, 0, max(), hd.offsetWidth);
    hd.style.left = (4 + s) + 'px';
    bar.style.width = (s + 54) + 'px';
  };
  // Both endings are springs that start at the release speed: no fixed duration, damping 1 so the knob does not wobble.
  const settle = (to, v) => { stop(); stop = spring.to(x, to, v, set); };
  const reset = (v) => { box.classList.remove('done'); lab.textContent = label; hd.textContent = '→'; settle(0, v); };
  const finish = (v) => {
    box.classList.add('done'); lab.textContent = '已确认'; hd.textContent = '✓';
    settle(max(), v);
    setTimeout(() => reset(0), 1800);
  };
  hd.addEventListener('pointerdown', (e) => {
    if (box.classList.contains('done')) return;
    stop();
    from = e.clientX - x;
    track = spring.tracker();
    track.add(x);
    hd.setPointerCapture(e.pointerId);
  });
  hd.addEventListener('pointermove', (e) => { if (from === null) return; set(e.clientX - from); track.add(x); });
  const up = () => {
    if (from === null) return;
    from = null;
    // Confirming a payment needs the knob really dragged to 85%; a flick alone never confirms, it only flavours the return.
    const v = track.speed();
    if (x > max() * .85) finish(v); else reset(v);
  };
  hd.addEventListener('pointerup', up);
  hd.addEventListener('pointercancel', up);
  hd.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); finish(0); } });
  U.auto(stage, () => {
    if (from !== null) return;
    stop();
    U.tween(1000, (p) => set(max() * .92 * U.easeOut(p)), () => finish(600));
  }, 5200);
};
</script>
<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFrozen = (stage) => reduced || stage.closest('.sp').classList.contains('off');
  const U = {
    loop(stage, fn, ms) { setInterval(() => { if (!isFrozen(stage)) fn(); }, ms); },
    auto(stage, fn, ms) { U.loop(stage, () => { if (!stage.dataset.touched) fn(); }, ms); },
    frame(stage, fn) { const step = (t) => { if (!isFrozen(stage)) fn(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
    tween(ms, fn, done) {
      const start = performance.now();
      const step = (now) => { const p = Math.min(1, (now - start) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); };
      requestAnimationFrame(step);
    },
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
  };
  const card = document.querySelector('.sp');
  const stage = card.querySelector('.stage');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle],[data-open],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-toggle')) stage.classList.toggle('on');
    else if (t.hasAttribute('data-open')) stage.classList.add('on');
    else stage.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stage.classList.remove('on'); });
  stage.addEventListener('pointerdown', () => { stage.dataset.touched = '1'; }, true);
  stage.addEventListener('focusin', () => { stage.dataset.touched = '1'; }, true);
  const fn = window.demo[card.dataset.demo];
  if (card.dataset.demo && !fn) console.error('missing demo: ' + card.dataset.demo);
  if (fn) fn(stage, U);
  let seen = false;
  new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      card.classList.toggle('off', !en.isIntersecting);
      if (!en.isIntersecting || seen) return;
      seen = true;
      setTimeout(() => {
        if (stage.dataset.touched) return;
        if (card.hasAttribute('data-auto')) stage.classList.add('on');
        stage.dispatchEvent(new Event('inview'));
      }, 450);
    });
  }, { threshold: 0.15 }).observe(card);
})();
</script>
</body></html>
