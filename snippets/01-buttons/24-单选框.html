<!doctype html>
<!--
名称：单选框（Radio）
编号：01-buttons/24
什么时候用：一组里只留一个，选中新的，旧的跟着取消。
一句话提示词：做一组单选框：自定义圆形外圈，选中时内部圆点从 0 弹到满尺寸，略带过冲，200ms；整行都可点击，只能选一个。
操作提示：点选项
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>单选框</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.f-opts { display: grid; gap: 11px; }
.f-opt { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.f-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.f-opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.f-rd { flex: none; width: 21px; height: 21px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: border-color .15s; }
.f-rd::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .2s cubic-bezier(.2, 1.7, .4, 1); }
.f-opt input:checked + .f-rd { border-color: var(--accent); }
.f-opt input:checked + .f-rd::after { transform: none; }
</style></head>
<body><article class="sp" data-name="单选框" data-en="Radio" data-hint="点选项" data-use="一组里只留一个，选中新的，旧的跟着取消。" data-prompt="做一组单选框：自定义圆形外圈，选中时内部圆点从 0 弹到满尺寸，略带过冲，200ms；整行都可点击，只能选一个。"><div class="stage"><fieldset class="f-opts" style="border:0;margin:0;padding:0"><legend style="padding:0;margin-bottom:9px;font-size:13px;color:var(--muted)">上课方式</legend><label class="f-opt"><input type="radio" id="f-r1" name="f-r" checked><span class="f-rd"></span>线下工作坊</label><label class="f-opt"><input type="radio" id="f-r2" name="f-r"><span class="f-rd"></span>线上直播</label><label class="f-opt"><input type="radio" id="f-r3" name="f-r"><span class="f-rd"></span>录播自学</label></fieldset></div></article>
</body></html>
