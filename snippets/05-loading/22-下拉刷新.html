<!doctype html>
<!--
名称：下拉刷新（Pull to Refresh）
编号：05-loading/22
什么时候用：手指往下拖，松开后顶上转一圈，新内容就到了。
一句话提示词：做下拉刷新（Pull to Refresh）：列表跟手下拉并有阻尼，超过 56px 松手后顶部转圈，新内容从上方滑入，然后列表回弹；不够距离就直接回弹。
操作提示：按住列表往下拉
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>下拉刷新</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.l-ptr { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.l-ptr-ind { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: grid; place-items: center; }
.l-ptr-ind i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--soft); border-top-color: var(--accent); }
.l-ptr.busy .l-ptr-ind i { animation: l-rot .8s linear infinite; }
.l-ptr-list { position: absolute; inset: 0; background: var(--stage); padding: 11px 15px; display: grid; gap: 7px; align-content: start; box-shadow: 0 -2px 6px var(--shadow); }
.l-ptr.back .l-ptr-list { transition: transform .3s cubic-bezier(.2, .9, .3, 1); }
.l-it { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 9px; font-size: 13.5px; background: var(--surface); }
.l-it i { flex: none; width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(145deg, var(--art3), var(--art1)); }
.l-it.new { animation: l-new .4s cubic-bezier(.2, 1.2, .4, 1); box-shadow: inset 0 0 0 1.5px var(--accent); }
@keyframes l-rot { to { transform: rotate(360deg); } }
@keyframes l-new { from { opacity: 0; transform: translateY(-14px) scale(.95); } }
</style></head>
<body><article class="sp" data-name="下拉刷新" data-en="Pull to Refresh" data-demo="pull" data-hint="按住列表往下拉" data-use="手指往下拖，松开后顶上转一圈，新内容就到了。" data-prompt="做下拉刷新（Pull to Refresh）：列表跟手下拉并有阻尼，超过 56px 松手后顶部转圈，新内容从上方滑入，然后列表回弹；不够距离就直接回弹。"><div class="stage"><div class="l-ptr"><div class="l-ptr-ind"><i></i></div><div class="l-ptr-list"><div class="l-it"><i></i>第 2 讲作业已批改</div><div class="l-it"><i></i>小组讨论：怎么写提示词</div><div class="l-it"><i></i>本周直播回放</div><div class="l-it"><i></i>学习群公告</div></div></div></div></article>
<script>window.demo = {};
demo.pull = (stage, U) => {
  const box = stage.querySelector('.l-ptr');
  const list = box.querySelector('.l-ptr-list');
  const NEWS = ['刚刚：老师发了新课件', '刚刚：林小满交了作业', '刚刚：直播改到周五'];
  const TRIGGER = 56;
  let start = null, y = 0, busy = false, n = 0;
  const move = (v) => { y = v; list.style.transform = 'translateY(' + v + 'px)'; box.querySelector('.l-ptr-ind i').style.transform = 'rotate(' + v * 5 + 'deg)'; };
  const refresh = () => {
    busy = true;
    box.classList.add('back', 'busy');
    box.querySelector('.l-ptr-ind i').style.transform = '';
    move(TRIGGER);
    setTimeout(() => {
      const item = document.createElement('div');
      item.className = 'l-it new';
      const icon = document.createElement('i');
      item.append(icon, NEWS[n++ % NEWS.length]);
      list.prepend(item);
      while (list.children.length > 4) list.lastChild.remove();
      box.classList.remove('busy');
      move(0);
      setTimeout(() => { busy = false; }, 320);
    }, 1100);
  };
  box.addEventListener('pointerdown', (e) => { if (busy) return; start = e.clientY; box.setPointerCapture(e.pointerId); box.classList.remove('back'); });
  box.addEventListener('pointermove', (e) => { if (start !== null) move(Math.max(0, (e.clientY - start) * .55)); });
  const end = () => {
    if (start === null) return;
    start = null;
    if (y >= TRIGGER) refresh(); else { box.classList.add('back'); move(0); }
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  U.auto(stage, () => {
    if (busy) return;
    box.classList.remove('back');
    U.tween(800, (p) => move(70 * U.easeOut(p)), refresh);
  }, 4600);
};
</script>
<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFrozen = (stage) => reduced || stage.closest('.sp').classList.contains('off');
  const U = {
    loop(stage, fn, ms) { setInterval(() => { if (!isFrozen(stage)) fn(); }, ms); },
    auto(stage, fn, ms) { U.loop(stage, () => { if (!stage.dataset.touched) fn(); }, ms); },
    frame(stage, fn) { const step = (t) => { if (!isFrozen(stage)) fn(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
    tween(ms, fn, done) {
      const start = performance.now();
      const step = (now) => { const p = Math.min(1, (now - start) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); };
      requestAnimationFrame(step);
    },
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
  };
  const card = document.querySelector('.sp');
  const stage = card.querySelector('.stage');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle],[data-open],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-toggle')) stage.classList.toggle('on');
    else if (t.hasAttribute('data-open')) stage.classList.add('on');
    else stage.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stage.classList.remove('on'); });
  stage.addEventListener('pointerdown', () => { stage.dataset.touched = '1'; }, true);
  stage.addEventListener('focusin', () => { stage.dataset.touched = '1'; }, true);
  const fn = window.demo[card.dataset.demo];
  if (card.dataset.demo && !fn) console.error('missing demo: ' + card.dataset.demo);
  if (fn) fn(stage, U);
  let seen = false;
  new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      card.classList.toggle('off', !en.isIntersecting);
      if (!en.isIntersecting || seen) return;
      seen = true;
      setTimeout(() => {
        if (stage.dataset.touched) return;
        if (card.hasAttribute('data-auto')) stage.classList.add('on');
        stage.dispatchEvent(new Event('inview'));
      }, 450);
    });
  }, { threshold: 0.15 }).observe(card);
})();
</script>
</body></html>
