<!doctype html>
<!--
名称：加载文案轮播（Loading Messages）
编号：05-loading/20
什么时候用：AI 生成这种要等几十秒的任务。告诉用户正在做哪一步，等待就有了盼头。
一句话提示词：做一个加载文案轮播：一行文字垂直滚动切换，每 2 秒一句，说明当前步骤，比如「正在读取需求」「正在排版」，上方配小动画。
移植：只搬「标本」部分的 CSS、.stage 内的结构和 demo 函数；颜色全是 CSS 变量，映射到目标项目的颜色；
      演示里的定时循环和假数据要换成真实状态；.stage、.sp、U.* 只是演示外壳。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>加载文案轮播</title>
<style>
/* 颜色变量和基础样式 */
:root {
  --bg: #F5ECDC; --surface: #FFFAF1; --stage: #FBF2E2; --ink: #3A2415; --muted: #75593F;
  --line: #E2D1B6; --accent: #BF540A; --accent-deep: #8F3D05; --accent-ink: #FFF8EE;
  --gold: #E0A526; --soft: #F5DDB5; --ok: #4C7527; --err: #B0301D; --scrim: rgba(58, 36, 21, .42);
  --shadow: rgba(92, 52, 20, .2); --on-art: #FFF8EE; --art1: #E98B2A; --art2: #B9480F; --art3: #F3C557;
  --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --stage-h: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
    --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
    --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D140E; --surface: #2A1E15; --stage: #231910; --ink: #F4E6D3; --muted: #C2A98E;
  --line: #47362A; --accent: #F08C2E; --accent-deep: #A65A12; --accent-ink: #2A1405;
  --gold: #EBB94A; --soft: #4B3321; --ok: #A0C86E; --err: #F08169; --scrim: rgba(0, 0, 0, .58);
  --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 演示外壳 */
.sp { max-width: 420px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; height: var(--stage-h); display: grid; place-items: center; overflow: hidden; isolation: isolate; background: var(--stage); }
.sp.off .stage *, .sp.off .stage *::before, .sp.off .stage *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; } }
/* 标本 */
.l-col { display: grid; justify-items: center; gap: 12px; }
.l-msgs { height: 28px; overflow: hidden; width: 100%; text-align: center; font-size: 15px; }
.l-msgs > div { animation: l-msgs 8s cubic-bezier(.3, .9, .3, 1) infinite; }
.l-msgs p { margin: 0; height: 28px; line-height: 28px; }
.l-hg { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(145deg, var(--art3), var(--art1)); animation: l-tile 1.6s cubic-bezier(.6, 0, .3, 1) infinite; }
@keyframes l-msgs { 0%, 22% { transform: none; } 25%, 47% { transform: translateY(-28px); } 50%, 72% { transform: translateY(-56px); } 75%, 97% { transform: translateY(-84px); } 100% { transform: translateY(-112px); } }
@keyframes l-tile { 0% { transform: none; } 50% { transform: rotate(180deg) scale(.8); border-radius: 50%; } 100% { transform: rotate(360deg); } }
</style></head>
<body><article class="sp" data-name="加载文案轮播" data-en="Loading Messages" data-use="AI 生成这种要等几十秒的任务。告诉用户正在做哪一步，等待就有了盼头。" data-prompt="做一个加载文案轮播：一行文字垂直滚动切换，每 2 秒一句，说明当前步骤，比如「正在读取需求」「正在排版」，上方配小动画。"><div class="stage"><div class="l-col" style="width:100%"><div class="l-hg"></div><div class="l-msgs" aria-live="off"><div><p>正在读取你的需求</p><p>正在挑选配色</p><p>正在排版内容</p><p>马上就好</p><p>正在读取你的需求</p></div></div></div></div></article>
</body></html>
